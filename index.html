// Patch renderTaskDetail to include GIS check-in for technicians
const _origRenderTaskDetail = renderTaskDetail;
renderTaskDetail = function(params){
  _origRenderTaskDetail(params);
  // Add GIS section if applicable
  const taskId = params?.id;
  const task = DB.tasks.find(t=>t.id===taskId);
  if(!task) return;
  const isTech = DB.currentRole==='technician';
  const myTask = isTech && task.assignees.includes(DB.currentUser.name);
  if(!myTask) return;
  // Inject GIS card after the page renders
  setTimeout(()=>{
    const firstGrid = document.querySelector('#page-task-detail .grid-2');
    if(!firstGrid) return;
    // Find right col
    const rightCol = firstGrid.children[1];
    if(!rightCol) return;
    const gisCard = document.createElement('div');
    gisCard.className='card';
    gisCard.style.marginBottom='16px';
    const myLocations = DB.gisLocations.filter(l=>l.taskId===taskId);
    gisCard.innerHTML=`
      <div class="card-header">
        <span class="card-title">🗺️ GIS 位置記錄</span>
        <button class="btn btn-primary btn-sm" onclick="gisCheckinForTask('${taskId}')">📍 打卡到達</button>

            <td style="color:var(--text-secondary)">${l.address.slice(0,30)}${l.address.length>30?'...':''}</td>
          </tr>`).join('')}</tbody>
        </table>
        <div style="padding:8px 16px;text-align:right">
          <button class="btn btn-secondary btn-sm" onclick="navigateTo('gis')">查看完整軌跡 🗺️</button>
        </div>`:
        `<div class="empty-state" style="padding:20px">
          <div class="es-icon" style="font-size:28px">📍</div>
          <p style="font-size:12px">尚無打卡記錄，請到達現場後打卡</p>
        </div>`}
      </div>`;
    rightCol.insertBefore(gisCard, rightCol.firstChild);
  },100);
};

function gisCheckinForTask(taskId){
  const task = DB.tasks.find(t=>t.id===taskId);
  // Pre-select this task in the checkin modal
  gisAddCheckin();
  setTimeout(()=>{
    const sel=document.getElementById('ck_task');
    if(sel) sel.value=taskId;
    const addr=document.getElementById('ck_addr');
    if(addr&&task) addr.value=task.location;
  },100);
}

// Approve a pending registration
function approveRegistration(regId){
  const reg=DB.pendingRegistrations.find(r=>r.id===regId);
  if(!reg)return;
  const authRole=document.getElementById('approveRole_'+regId)?.value||'manager';
  const authRoleLabel={supervisor:'Supervisor 最高權限',manager:'Manager 使用者',browser:'Browser 瀏覽者'}[authRole]||authRole;
  reg.status='approved';
  // Create auth user account
  const newUser={
    id:'AU'+Date.now(),
    email:reg.email,
    password:reg.password,
    name:reg.name,
    avatar:reg.name.charAt(0),
    authRole,
    systemRole:reg.systemRole,
    status:'active',
    createdAt:new Date().toLocaleString('zh-TW',{hour12:false}).replace(/\//g,'-'),
    lastLogin:null
  };
  DB.authUsers.push(newUser);
  // Send approval email
  const subj=encodeURIComponent('[DMS系統] 帳號申請已核准 — '+reg.name);
  const body=encodeURIComponent(
    '您好 '+reg.name+'，\n\n您的 DMS 系統帳號申請已獲核准，現在可以登入使用。\n\n'
    +'電子郵件：'+reg.email+'\n'
    +'授予權限：'+authRoleLabel+'\n\n'
    +'請至 DMS 系統登入頁使用您申請時設定的密碼登入。\n\n'
    +'DMS 派工管理系統 自動通知信'
  );
  window.open('mailto:'+reg.email+'?subject='+subj+'&body='+body,'_blank');
  // Add system notification
  DB.notifications.unshift({id:'N'+Date.now(),title:'帳號申請已批准',msg:`${reg.name} (${reg.email}) 已核准 ${authRoleLabel} 權限`,time:'剛剛',type:'success',read:false,taskId:''});
  renderNotifList();
  buildNav(); // refresh badge count
  showToast(`✅ 已批准 ${reg.name} 的帳號申請，並發送確認 Email`,'success');
  renderPage('account-mgmt');
}

// Reject a pending registration
function rejectRegistration(regId){
  openModal('拒絕帳號申請',`
    <div style="margin-bottom:16px">
      <p style="color:var(--text-secondary);margin-bottom:12px">請輸入拒絕原因（將發送通知給申請人）：</p>
      <textarea id="rejectReason" class="field-input" rows="3" placeholder="例如：無法驗證身份、非授權人員..." style="resize:vertical"></textarea>
    </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">取消</button>
     <button class="btn btn-danger" onclick="confirmRejectRegistration('${regId}')">❌ 確認拒絕</button>`
  );
}
function confirmRejectRegistration(regId){
  const reg=DB.pendingRegistrations.find(r=>r.id===regId);
  if(!reg)return;
  const reason=document.getElementById('rejectReason')?.value||'未提供原因';
  reg.status='rejected';
  // Send rejection email
  const subj=encodeURIComponent('[DMS系統] 帳號申請未通過 — '+reg.name);
  const body=encodeURIComponent(
    '您好 '+reg.name+'，\n\n很遺憾，您的 DMS 系統帳號申請未獲核准。\n\n'
    +'拒絕原因：'+reason+'\n\n'
    +'如有疑問請聯繫系統管理員。\n\nDMS 派工管理系統 自動通知信'
  );
  window.open('mailto:'+reg.email+'?subject='+subj+'&body='+body,'_blank');
  DB.notifications.unshift({id:'N'+Date.now(),title:'帳號申請已拒絕',msg:`${reg.name} 的申請已拒絕：${reason}`,time:'剛剛',type:'danger',read:false,taskId:''});
  renderNotifList();
  closeModal();
  buildNav();
  showToast(`已拒絕 ${reg.name} 的帳號申請`,'warning');
  renderPage('account-mgmt');
}

// Toggle user active/disabled status
function toggleUserStatus(userId){
  const user=DB.authUsers.find(u=>u.id===userId);
  if(!user)return;
  user.status=user.status==='active'?'disabled':'active';
  showToast(`帳號 ${user.name} 已${user.status==='active'?'啟用':'停用'}`,'info');
  renderPage('account-mgmt');
}

// Edit auth role of existing user
function editAuthRole(userId){
  const user=DB.authUsers.find(u=>u.id===userId);
  if(!user)return;
  openModal('修改帳號權限',`
    <div style="margin-bottom:16px">
      <p style="color:var(--text-secondary);margin-bottom:4px">帳號：<strong>${user.name}</strong>（${user.email}）</p>
      <p style="color:var(--text-secondary);margin-bottom:12px;font-size:12px">目前權限：${user.authRole}</p>
      <label class="field-label">新權限等級</label>
      <select id="newAuthRole" class="field-input">
        <option value="supervisor" ${user.authRole==='supervisor'?'selected':''}>⭐ Supervisor 最高權限管理者</option>
        <option value="manager" ${user.authRole==='manager'?'selected':''}>👤 Manager 使用者</option>
        <option value="browser" ${user.authRole==='browser'?'selected':''}>👁️ Browser 瀏覽者（唯讀）</option>
      </select>
    </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">取消</button>
     <button class="btn btn-primary" onclick="confirmEditAuthRole('${userId}')">💾 確認修改</button>`
  );
}
function confirmEditAuthRole(userId){
  const user=DB.authUsers.find(u=>u.id===userId);
  if(!user)return;
  const newRole=document.getElementById('newAuthRole')?.value;
  if(!newRole)return;
  user.authRole=newRole;
  closeModal();
  showToast(`✅ 已將 ${user.name} 的權限更新為 ${newRole}`,'success');
  renderPage('account-mgmt');
}

    `<button class="btn btn-secondary" onclick="closeModal()">取消</button>
     <button class="btn btn-primary" onclick="confirmAddAccount()">➕ 建立帳號</button>`

function confirmAddAccount(){
  const name=(document.getElementById('add_name')?.value||'').trim();
  const email=(document.getElementById('add_email')?.value||'').trim().toLowerCase();
  const pass=document.getElementById('add_pass')?.value||'';
  const sysRole=document.getElementById('add_sysrole')?.value||'dispatcher';
  const authRole=document.getElementById('add_authrole')?.value||'manager';
  if(!name||!email||pass.length<6){showToast('請填寫所有必填欄位，密碼至少6位','danger');return;}
  if(DB.authUsers.find(u=>u.email.toLowerCase()===email)){showToast('此電子郵件已有帳號','danger');return;}
  const newUser={
    id:'AU'+Date.now(),email,
    password:simplePwHash(pass),
    name,avatar:name.charAt(0),
    authRole,systemRole:sysRole,
    status:'active',
    createdAt:new Date().toLocaleString('zh-TW',{hour12:false}).replace(/\//g,'-'),
    lastLogin:null
  };
  DB.authUsers.push(newUser);
  closeModal();
  showToast(`✅ 帳號 ${name} 建立成功`,'success');
  renderPage('account-mgmt');
}
