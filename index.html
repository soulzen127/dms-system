      <div class="kpi-icon">▶️</div>
      <span class="badge badge-inprogress">即時</span>
    </div>
    <div class="kpi-card" style="--kpi-color:var(--accent-green)">
      <div class="kpi-label">已完工</div>
      <div class="kpi-value">${done}</div>
      <div class="kpi-sub">待審核:1</div>
      <div class="kpi-icon">✅</div>
      <div class="kpi-trend up">↑ 完成率 ${Math.round(done/total*100)}%</div>
    </div>
    <div class="kpi-card" style="--kpi-color:var(--accent-yellow)">
      <div class="kpi-label">待接單</div>
      <div class="kpi-value">${pending}</div>
      <div class="kpi-sub">等待人員確認</div>
      <div class="kpi-icon">⏳</div>
    </div>
    <div class="kpi-card" style="--kpi-color:var(--accent-red)" onclick="navigateTo('tasks')">
      <div class="kpi-label">異常通報</div>
      <div class="kpi-value">${anomaly}</div>
      <div class="kpi-sub">需立即處理</div>
      <div class="kpi-icon">⚠️</div>
      ${anomaly>0?'<span class="badge badge-anomaly pulse">需處理</span>':'<span class="badge badge-completed">正常</span>'}
    </div>
    <div class="kpi-card" style="--kpi-color:var(--accent-orange)">
      <div class="kpi-label">SLA 逾期</div>
      <div class="kpi-value">${overdue}</div>
      <div class="kpi-sub">超出預定工時</div>
      <div class="kpi-icon">⏰</div>
      ${overdue>0?'<span class="badge badge-high pulse">逾期</span>':'<span class="badge badge-completed">正常</span>'}
    </div>
  </div>

  <div class="grid-2" style="margin-bottom:20px">
    <div class="card">
      <div class="card-header">
        <span class="card-title">📈 本週任務狀態分佈</span>
      </div>
      <div class="card-body">
        <div class="chart-container"><canvas id="chartStatus"></canvas></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">⚡ 近期動態</span>
        <button class="btn btn-secondary btn-sm" onclick="navigateTo('audit')">查看全部</button>
      </div>
      <div class="card-body" style="padding:12px 20px;">
        <div class="timeline" id="recentActivity"></div>
      </div>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <div class="card-header">
        <span class="card-title">🔴 需立即關注</span>
      </div>
      <div class="card-body" style="padding:0">
        <table class="data-table">
          <thead><tr><th>派工單</th><th>任務名稱</th><th>狀態</th><th>SLA</th></tr></thead>
          <tbody id="urgentTasks"></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">👥 人員工作負荷</span>
      </div>
      <div class="card-body">
        <div id="teamWorkload"></div>
      </div>
    </div>
  </div>`;

  // Charts
  setTimeout(()=>{
    const ctx=document.getElementById('chartStatus');
    if(ctx){
      new Chart(ctx,{
        type:'doughnut',
        data:{
          labels:['待接受','已接受','執行中','暫停','異常','已完工'],
          datasets:[{data:[pending,tasks.filter(t=>t.status==='accepted').length,inprog,tasks.filter(t=>t.status==='paused').length,anomaly,done],backgroundColor:['#ffd700','#00d4ff','#1a6fff','#ff6b35','#ff4757','#00ff88'],borderWidth:0,hoverOffset:6}]
        },
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#7ba3c9',font:{size:11},padding:12}},tooltip:{callbacks:{label:function(c){return ` ${c.label}: ${c.raw}件`;}}}},cutout:'65%'}
      });
    }

    // Recent activity
    const allHistory=[];
    DB.tasks.forEach(t=>{
      t.history.forEach(h=>{allHistory.push({...h,taskId:t.id,taskTitle:t.title});});
    });
    allHistory.sort((a,b)=>b.time.localeCompare(a.time));
    const recent=allHistory.slice(0,6);
    document.getElementById('recentActivity').innerHTML=recent.map(h=>`
      <div class="timeline-item">
        <div class="timeline-dot ${h.type==='anomaly'?'danger':h.type==='approve'||h.type==='complete'?'success':h.type==='create'?'active':''}"></div>
        <div class="timeline-time">${h.time}</div>
        <div class="timeline-text"><strong>${getTypeIcon(h.type)} ${h.taskId}</strong> ${h.action} <span style="color:var(--text-muted)">— ${h.user}</span></div>
      </div>`).join('');

    // Urgent tasks
    const urgent=DB.tasks.filter(t=>t.status==='anomaly'||t.priority==='high'||(t.slaHours&&t.elapsed/t.slaHours>0.8)).slice(0,5);
    document.getElementById('urgentTasks').innerHTML=urgent.map(t=>`
      <tr onclick="navigateTo('task-detail',{id:'${t.id}'})" style="cursor:pointer">
        <td><span style="font-family:monospace;font-size:11px;color:var(--text-muted)">${t.id}</span></td>
        <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.title}</td>
        <td>${statusBadge(t.status)}</td>
        <td>${slaBar(t)}</td>
      </tr>`).join('');

    // Workload
    const techUsers=DB.users.filter(u=>u.role==='technician');
    document.getElementById('teamWorkload').innerHTML=techUsers.map(u=>{
      const myTasks=DB.tasks.filter(t=>t.assignees.includes(u.name)&&t.status!=='completed'&&t.status!=='approved');
      const pct=Math.min(100,myTasks.length*25);
      const cls='';
      return `<div class="stat-row">
        <div style="display:flex;align-items:center;gap:8px;flex:1">
          <div class="avatar-sm">${u.avatar}</div>
          <span class="stat-row-label">${u.name}</span>
        </div>
        <div class="stat-row-bar"><div class="stat-row-fill" style="width:${pct}%;background:${pct>75?'var(--accent-red)':pct>50?'var(--accent-yellow)':'var(--accent-cyan)'}"></div></div>
        <span class="stat-row-val">${myTasks.length}件</span>
      </div>`;
    }).join('');
  },50);
}

// ============================================================
// TASK BOARD (KANBAN)
// ============================================================
function renderTaskBoard(){
  const el=document.getElementById('page-tasks');
  const cols=[
    {key:'anomaly',label:'⚠️ 異常',color:'var(--accent-red)'},
    {key:'pending',label:'待接單',color:'var(--accent-yellow)'},
    {key:'accepted',label:'已接受',color:'var(--accent-cyan)'},
    {key:'inprogress',label:'執行中',color:'var(--accent-blue)'},
    {key:'paused',label:'暫停中',color:'var(--accent-orange)'},
    {key:'completed',label:'完工待審',color:'var(--accent-green)'},
    {key:'approved',label:'✅ 已核准',color:'rgba(0,255,136,0.6)'}
  ];
  let html=`
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
    <div class="section-title" style="margin-bottom:0">📋 派工看板</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" onclick="navigateTo('create-task')">➕ 建立派工單</button>
      <button class="btn btn-secondary" onclick="navigateTo('task-list')">📝 列表檢視</button>
    </div>
  </div>
  <div class="kanban-board">`;
  cols.forEach(col=>{
    const priOrder={high:0,medium:1,low:2};
    const tasks=DB.tasks.filter(t=>t.status===col.key).sort((a,b)=>priOrder[a.priority]-priOrder[b.priority]);
    html+=`<div class="kanban-col">
      <div class="kanban-col-header">
        <span class="kanban-col-title" style="color:${col.color}">${col.label}</span>
        <span class="kanban-count">${tasks.length}</span>
      </div>
      <div class="kanban-cards">`;
    tasks.forEach(t=>{
      html+=`<div class="kanban-card" onclick="navigateTo('task-detail',{id:'${t.id}'})">
        <div class="kanban-card-id">${t.id}</div>
        <div class="kanban-card-title">${t.title}</div>
        <div style="margin-bottom:8px">${priorityBadge(t.priority)}</div>
        ${slaBar(t)}
        <div class="kanban-card-meta" style="margin-top:8px">
          <div class="kanban-card-assignee">
            ${t.assignees.slice(0,2).map(a=>`<div class="avatar-sm">${a[0]}</div>`).join('')}
            <span>${t.assignees.join(', ')}</span>
          </div>
          <span style="font-size:10px;color:var(--text-muted)">${t.deadline.split(' ')[0]}</span>
        </div>
      </div>`;
    });
    if(!tasks.length)html+=`<div class="empty-state" style="padding:20px"><div class="es-icon" style="font-size:24px">📭</div><p style="font-size:11px">暫無任務</p></div>`;
    html+=`</div></div>`;
  });
  html+=`</div>`;
  el.innerHTML=html;
}

// ============================================================
// TASK LIST
// ============================================================
function renderTaskList(filterStatus){
  const el=document.getElementById('page-task-list');
  el.innerHTML=`
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
    <div class="section-title" style="margin-bottom:0">📝 派工單列表</div>
    ${DB.currentRole==='dispatcher'?'<button class="btn btn-primary" onclick="navigateTo(\'create-task\')">➕ 建立派工單</button>':''}
  </div>
  <div class="card">
    <div class="card-header">
      <div class="filter-bar" style="margin-bottom:0;flex:1">
        <input class="filter-input" placeholder="🔍 搜尋任務..." id="tblSearch" oninput="filterTaskTable()">
        <select class="filter-input" id="tblStatus" onchange="filterTaskTable()">
          <option value="">全部狀態</option>
          <option value="pending">待接單</option>
          <option value="accepted">已接受</option>
          <option value="inprogress">執行中</option>
          <option value="paused">暫停</option>
          <option value="anomaly">異常</option>
          <option value="completed">已完工</option>
        </select>
        <select class="filter-input" id="tblPriority" onchange="filterTaskTable()">
          <option value="">全部優先</option>
          <option value="high">高優先</option>
          <option value="medium">中優先</option>
          <option value="low">低優先</option>
        </select>
        <select class="filter-input" id="tblCat" onchange="filterTaskTable()">
          <option value="">全部類別</option>
          <option value="設備維修">設備維修</option>
          <option value="網路設備">網路設備</option>
          <option value="電力設備">電力設備</option>
          <option value="安全設備">安全設備</option>
          <option value="設備安裝">設備安裝</option>
        </select>
      </div>
    </div>
    <div class="data-table-wrap">
      <table class="data-table" id="taskTable">
        <thead><tr>
          <th>派工單編號</th><th>任務名稱</th><th>優先</th><th>狀態</th>
          <th>指派人員</th><th>截止日期</th><th>SLA</th><th>操作</th>
        </tr></thead>
        <tbody id="taskTableBody"></tbody>
      </table>
    </div>
  </div>`;
  filterTaskTable();
}
function filterTaskTable(){
  const search=(document.getElementById('tblSearch')?.value||'').toLowerCase();
  const status=document.getElementById('tblStatus')?.value||'';
  const priority=document.getElementById('tblPriority')?.value||'';
  const cat=document.getElementById('tblCat')?.value||'';
  let tasks=DB.tasks;
  if(search)tasks=tasks.filter(t=>t.id.toLowerCase().includes(search)||t.title.includes(search)||t.location.includes(search)||t.assignees.join().includes(search));
  if(status)tasks=tasks.filter(t=>t.status===status);
  if(priority)tasks=tasks.filter(t=>t.priority===priority);
  if(cat)tasks=tasks.filter(t=>t.category===cat);
  const body=document.getElementById('taskTableBody');
  if(!body)return;
  body.innerHTML=tasks.map(t=>`
    <tr onclick="navigateTo('task-detail',{id:'${t.id}'})" style="cursor:pointer">
      <td><span style="font-family:monospace;font-size:11px;color:var(--accent-cyan)">${t.id}</span></td>
      <td><div style="font-weight:600">${t.title}</div><div style="font-size:11px;color:var(--text-muted)">${t.location}</div></td>
      <td>${priorityBadge(t.priority)}</td>
      <td>${statusBadge(t.status)}</td>
      <td><div style="display:flex;gap:4px;flex-wrap:wrap">${t.assignees.map(a=>`<span class="chip">${a}</span>`).join('')}</div></td>
      <td style="font-size:12px;color:var(--text-secondary)">${fmtDate(t.deadline)}</td>
      <td style="min-width:120px">${slaBar(t)}</td>
      <td><div style="display:flex;gap:4px">
        <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();navigateTo('task-detail',{id:'${t.id}'})">詳情</button>
        ${DB.currentRole==='dispatcher'?`<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteTask('${t.id}')">刪除</button>`:''}
      </div></td>
    </tr>`).join('')||`<tr><td colspan="8"><div class="empty-state"><div class="es-icon">📭</div><p>查無資料</p></div></td></tr>`;
}
function deleteTask(id){
  if(!confirm('確定要刪除此派工單？'))return;
  DB.tasks=DB.tasks.filter(t=>t.id!==id);
  renderTaskList();
  showToast('派工單已刪除','warning');
}
</script>
<script>
// ============================================================
// CREATE TASK (WIZARD)
// ============================================================
function renderCreateTask(){
  DB.createTaskStep=1;
  DB.createTaskData={priority:'medium',assignees:[],materials:[]};
  renderCreateTaskStep();
}
function renderCreateTaskStep(){
  const el=document.getElementById('page-create-task');
  const step=DB.createTaskStep;
  const steps=[{label:'基本資訊'},{label:'指派人員'},{label:'附加資料'},{label:'確認送出'}];
  const stepsHtml=steps.map((s,i)=>{
    const n=i+1;
    const cls=n<step?'done':n===step?'active':'';
    return `<div class="wizard-step ${cls}">
      <div class="step-circle">${n<step?'✓':n}</div>
      <span class="step-label">${s.label}</span>
      ${i<steps.length-1?`<div class="step-line"></div>`:''}
    </div>`;
  }).join('');

  let content='';
  if(step===1){
    content=`
    <div class="form-row cols-2">
      <div><label class="field-label">任務名稱 <span class="required">*</span></label>
        <input class="field-input" id="ct_title" value="${DB.createTaskData.title||''}" placeholder="請輸入任務名稱"></div>
      <div><label class="field-label">任務類別 <span class="required">*</span></label>
        <select class="field-input" id="ct_cat">
          ${['設備維修','網路設備','電力設備','安全設備','設備安裝','定期巡檢','其他'].map(c=>`<option ${DB.createTaskData.category===c?'selected':''}>${c}</option>`).join('')}
        </select></div>
    </div>
    <div class="form-row"><div><label class="field-label">任務描述 <span class="required">*</span></label>
      <textarea class="field-input" id="ct_desc" placeholder="詳細描述任務內容、要求及注意事項...">${DB.createTaskData.desc||''}</textarea></div></div>
    <div class="form-row cols-2">
      <div><label class="field-label">工作地點 <span class="required">*</span></label>
        <input class="field-input" id="ct_loc" value="${DB.createTaskData.location||''}" placeholder="地址、設備位置或樓層"></div>
      <div><label class="field-label">優先順序</label>
        <select class="field-input" id="ct_pri">
          <option value="high" ${DB.createTaskData.priority==='high'?'selected':''}>🔴 高優先</option>
          <option value="medium" ${DB.createTaskData.priority==='medium'?'selected':''}>🟡 中優先</option>
          <option value="low" ${DB.createTaskData.priority==='low'?'selected':''}>🟢 低優先</option>
        </select></div>
    </div>
    <div class="form-row cols-2">
      <div><label class="field-label">預計完工截止 <span class="required">*</span></label>
        <input class="field-input" type="datetime-local" id="ct_deadline" value="${DB.createTaskData.deadline||''}"></div>
      <div><label class="field-label">SLA 時限（小時）</label>
        <input class="field-input" type="number" id="ct_sla" value="${DB.createTaskData.slaHours||72}" min="1" max="720"></div>
    </div>`;
  } else if(step===2){
    const techs=DB.users.filter(u=>u.role==='technician');
    content=`
    <label class="field-label">選擇執行人員 <span class="required">*</span></label>
    <div class="field-hint" style="margin-bottom:12px">可多選，點選人員卡片進行指派</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">
      ${techs.map(u=>`
        <div class="role-card ${(DB.createTaskData.assignees||[]).includes(u.name)?'active':''}" 
          onclick="toggleAssignee('${u.name}',this)" style="text-align:left;padding:12px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <div class="avatar-sm">${u.avatar}</div>
            <div style="font-size:13px;font-weight:600;color:var(--text-primary)">${u.name}</div>
          </div>
          <div style="font-size:11px;color:var(--text-muted)">${u.dept}</div>
          <div style="font-size:11px;color:var(--text-muted)">${u.phone}</div>
          <div style="margin-top:6px;font-size:11px">
            ${DB.tasks.filter(t=>t.assignees.includes(u.name)&&t.status!=='completed').length} 件進行中
          </div>
        </div>`).join('')}
    </div>
    <div class="divider"></div>
    <label class="field-label">通知方式</label>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      ${['📧 電子郵件','💬 即時訊息','📱 簡訊'].map(m=>`<label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);cursor:pointer"><input type="checkbox" checked style="accent-color:var(--accent-cyan)"> ${m}</label>`).join('')}
    </div>`;
  } else if(step===3){
    content=`
    <div class="form-row"><div>
      <label class="field-label">附加說明 / 備註</label>
      <textarea class="field-input" id="ct_notes" placeholder="特殊注意事項、安全要求等...">${DB.createTaskData.extraNotes||''}</textarea>
    </div></div>
    <div class="form-row"><div>
      <label class="field-label">附件上傳（可選）</label>
      <div class="upload-area">
        <div class="ua-icon">📎</div>
        <p>拖曳或點選上傳檔案、照片</p>
        <p style="margin-top:4px;font-size:11px">支援 PDF、JPG、PNG、DOC（最大 20MB）</p>
      </div>
    </div></div>
    <label class="field-label" style="margin-bottom:8px">預計使用材料／零件</label>
    <div class="material-list" id="materialList">
      ${(DB.createTaskData.materials||[]).map((m,i)=>materialRow(m,i)).join('')}
      ${(DB.createTaskData.materials||[]).length===0?materialRow({},0):''}
    </div>
    <button class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="addMaterialRow()">+ 新增材料</button>`;
  } else if(step===4){
    const d=DB.createTaskData;
    content=`
    <div style="margin-bottom:16px">
      <div class="section-title" style="font-size:14px">確認派工單資訊</div>
      <div class="card" style="margin-bottom:12px">
        <div class="card-body">
          <div style="display:grid;grid-template-columns:120px 1fr;gap:8px;font-size:13px">
            <span style="color:var(--text-muted)">任務名稱</span><span style="font-weight:600">${d.title||'—'}</span>
            <span style="color:var(--text-muted)">類別</span><span>${d.category||'—'}</span>
            <span style="color:var(--text-muted)">地點</span><span>${d.location||'—'}</span>
            <span style="color:var(--text-muted)">優先順序</span><span>${priorityBadge(d.priority)}</span>
            <span style="color:var(--text-muted)">截止時限</span><span>${d.deadline||'—'}</span>
            <span style="color:var(--text-muted)">SLA 時限</span><span>${d.slaHours||72} 小時</span>
            <span style="color:var(--text-muted)">指派人員</span><span>${(d.assignees||[]).join('、')||'—'}</span>
          </div>
        </div>
      </div>
      <div style="background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.3);border-radius:var(--radius);padding:14px;font-size:13px;color:var(--accent-green)">
        ✅ 建立後系統將自動發送通知給指派人員，請確認資訊正確後送出。
      </div>
    </div>`;
  }

  el.innerHTML=`
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
    <div class="section-title" style="margin-bottom:0">➕ 建立派工單</div>
  </div>
  <div class="card" style="max-width:860px;margin:0 auto">
    <div class="card-header">
      <div class="wizard-steps">${stepsHtml}</div>
    </div>
    <div class="card-body">${content}</div>
    <div class="modal-footer" style="padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px">
      <button class="btn btn-secondary" onclick="${step===1?'navigateTo(\'task-list\')':'prevCreateStep()'}">${step===1?'✕ 取消':'← 上一步'}</button>
      <button class="btn btn-primary" onclick="${step===4?'submitTask()':'nextCreateStep()'}">
        ${step===4?'🚀 建立派工單並發送通知':'下一步 →'}
      </button>
    </div>
  </div>`;
}
function materialRow(m,i){
  return `<div class="material-item" id="mat-${i}">
    <input placeholder="料號 / 品名" value="${m.name||''}">
    <input placeholder="數量" type="number" min="1" value="${m.qty||1}" style="width:60px">
    <input placeholder="單位" value="${m.unit||'個'}" style="width:50px">
    <button class="btn-icon" onclick="this.closest('.material-item').remove()">✕</button>
  </div>`;
}
function addMaterialRow(){
  const list=document.getElementById('materialList');
  const idx=list.children.length;
  const div=document.createElement('div');
  div.innerHTML=materialRow({},idx);
  list.appendChild(div.firstElementChild);
}
function toggleAssignee(name,el){
  if(!DB.createTaskData.assignees)DB.createTaskData.assignees=[];
  const idx=DB.createTaskData.assignees.indexOf(name);
  if(idx>-1){DB.createTaskData.assignees.splice(idx,1);el.classList.remove('active');}
  else{DB.createTaskData.assignees.push(name);el.classList.add('active');}
}
function nextCreateStep(){
  const d=DB.createTaskData;
  if(DB.createTaskStep===1){
    d.title=document.getElementById('ct_title')?.value;
    d.category=document.getElementById('ct_cat')?.value;
    d.desc=document.getElementById('ct_desc')?.value;
    d.location=document.getElementById('ct_loc')?.value;
    d.priority=document.getElementById('ct_pri')?.value||'medium';
    d.deadline=document.getElementById('ct_deadline')?.value;
    d.slaHours=parseInt(document.getElementById('ct_sla')?.value)||72;
    if(!d.title||!d.desc||!d.location||!d.deadline){showToast('請填寫所有必填欄位','danger');return;}
  }
  if(DB.createTaskStep===2&&(!d.assignees||!d.assignees.length)){showToast('請至少指派一位執行人員','danger');return;}
  if(DB.createTaskStep===3){
    d.extraNotes=document.getElementById('ct_notes')?.value;
    const mats=[];
    document.querySelectorAll('.material-item').forEach(el=>{
      const inputs=el.querySelectorAll('input');
      if(inputs[0]?.value)mats.push({name:inputs[0].value,qty:inputs[1]?.value||1,unit:inputs[2]?.value||'個'});
    });
    d.materials=mats;
  }
  DB.createTaskStep++;
  renderCreateTaskStep();
}
function prevCreateStep(){DB.createTaskStep--;renderCreateTaskStep();}
function submitTask(){
  const d=DB.createTaskData;
  const now=new Date();
  const dateStr=`${now.getMonth()+1}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const newId=`DMS-2025-00${DB.nextId++}`;
  const task={
    id:newId,title:d.title,desc:d.desc,location:d.location,priority:d.priority,
    assignees:d.assignees,status:'pending',
    created:`2025-07-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
    deadline:d.deadline?.replace('T',' ')||'',category:d.category,
    requester:DB.currentUser.name,slaHours:d.slaHours,elapsed:0,
    notes:[],materials:d.materials||[],
    history:[{time:dateStr,action:'建立派工單',user:DB.currentUser.name,type:'create'},{time:dateStr,action:'通知發送至執行人員',user:'系統',type:'system'}]
  };
  DB.tasks.unshift(task);
  DB.notifications.unshift({id:'n'+Date.now(),title:'新派工單已建立',msg:`${newId} ${d.title} 已建立並發送通知`,time:'剛剛',type:'success',read:false,taskId:newId});
  renderNotifList();
  showToast(`派工單 ${newId} 已成功建立並發送通知 ✅`,'success');
  navigateTo('task-detail',{id:newId});
}
</script>
<script>
// ============================================================
// TASK DETAIL
// ============================================================
function renderTaskDetail(params){
  const taskId=params?.id;
  const task=DB.tasks.find(t=>t.id===taskId);
  if(!task){document.getElementById('page-task-detail').innerHTML='<div class="empty-state"><div class="es-icon">🔍</div><p>找不到派工單</p></div>';return;}
  const isDispatcher=DB.currentRole==='dispatcher';
  const isManager=DB.currentRole==='manager';
  const isTech=DB.currentRole==='technician';
  const myTask=isTech&&task.assignees.includes(DB.currentUser.name);
  const el=document.getElementById('page-task-detail');

  // Status actions for technician
  let techActions='';
  if(myTask){
    if(task.status==='accepted'){
      techActions=`<div class="status-actions">
        <div class="status-action-btn sab-start" onclick="updateTaskStatus('${task.id}','inprogress','開始執行作業')"><div class="sa-icon">▶️</div><div class="sa-label">開始作業</div></div>
        <div class="status-action-btn sab-anomaly" onclick="reportAnomaly('${task.id}')"><div class="sa-icon">⚠️</div><div class="sa-label">異常通報</div></div>
      </div>`;
    }else if(task.status==='inprogress'){
      techActions=`<div class="status-actions">
        <div class="status-action-btn sab-pause" onclick="pauseTask('${task.id}')"><div class="sa-icon">⏸️</div><div class="sa-label">暫停作業</div></div>
        <div class="status-action-btn sab-anomaly" onclick="reportAnomaly('${task.id}')"><div class="sa-icon">⚠️</div><div class="sa-label">異常通報</div></div>
        <div class="status-action-btn sab-complete" onclick="navigateTo('task-detail',{id:'${task.id}',showCompletion:true})"><div class="sa-icon">🏁</div><div class="sa-label">完工回報</div></div>
      </div>`;
    }else if(task.status==='paused'){
      techActions=`<div style="background:rgba(255,107,53,0.08);border:1px solid rgba(255,107,53,0.3);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--accent-orange)">
        ⏸️ 作業已暫停 — 可繼續執行或直接填寫完工回報
      </div>
      <div class="status-actions">
        <div class="status-action-btn sab-start" onclick="updateTaskStatus('${task.id}','inprogress','工作重新啟動')"><div class="sa-icon">▶️</div><div class="sa-label">繼續作業</div></div>
        <div class="status-action-btn sab-complete" onclick="navigateTo('task-detail',{id:'${task.id}',showCompletion:true})"><div class="sa-icon">🏁</div><div class="sa-label">填完工回報</div></div>
        <div class="status-action-btn sab-anomaly" onclick="reportAnomaly('${task.id}')"><div class="sa-icon">⚠️</div><div class="sa-label">異常通報</div></div>
      </div>`;
    }else if(task.status==='pending'){
      techActions=`<div class="status-actions">
        <div class="status-action-btn sab-start" onclick="acceptTask('${task.id}')"><div class="sa-icon">✅</div><div class="sa-label">接受任務</div></div>
        <div class="status-action-btn sab-anomaly" onclick="rejectTask('${task.id}')"><div class="sa-icon">❌</div><div class="sa-label">拒絕任務</div></div>
      </div>`;
    }else if(task.status==='anomaly'){
      // Anomaly: can resolve & resume, or resolve & complete directly
      techActions=`<div style="background:rgba(255,71,87,0.08);border:1px solid rgba(255,71,87,0.3);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px">
        <span style="font-size:20px">⚠️</span>
        <div><div style="font-size:13px;font-weight:600;color:var(--accent-red)">任務目前處於異常狀態</div>
        <div style="font-size:11px;color:var(--text-muted)">請先排除異常問題，再選擇繼續作業或填寫完工回報</div></div>
      </div>
      <div class="status-actions">
        <div class="status-action-btn sab-start" onclick="resolveAnomaly('${task.id}')"><div class="sa-icon">🔄</div><div class="sa-label">異常已排除<br>繼續作業</div></div>
        <div class="status-action-btn sab-complete" onclick="navigateTo('task-detail',{id:'${task.id}',showCompletion:true})"><div class="sa-icon">🏁</div><div class="sa-label">異常已處理<br>填完工回報</div></div>
      </div>`;
    }
  }

  // Show completion report form if requested
  if(params?.showCompletion&&myTask){
    renderCompletionReport(task);return;
  }

  el.innerHTML=`
  ${task.needsReassign?`<div style="background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.4);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px">
    <span style="font-size:18px">👤</span>
    <div><div style="font-size:13px;font-weight:600;color:var(--accent-yellow)">此任務需要重新指派執行人員</div>
    <div style="font-size:11px;color:var(--text-muted)">執行人員已拒絕此任務，請重新指派後發送通知</div></div>
    ${isDispatcher?`<button class="btn btn-warning btn-sm" style="margin-left:auto" onclick="reassignTask('${task.id}')">🔄 立即指派</button>`:''}
  </div>`:''}
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap">
    <button class="btn btn-secondary btn-sm" onclick="navigateTo('task-list')">← 返回列表</button>
    <div class="section-title" style="margin-bottom:0;flex:1">📋 ${task.id}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${statusBadge(task.status)} ${priorityBadge(task.priority)}
      ${isDispatcher?`<button class="btn btn-secondary btn-sm" onclick="editTask('${task.id}')">✏️ 編輯</button>`:''}
      ${isDispatcher&&(task.status==='completed')?`<button class="btn btn-success btn-sm" onclick="approveTask('${task.id}')">✅ 審核核准</button><button class="btn btn-danger btn-sm" onclick="rejectCompletion('${task.id}')">❌ 退回</button>`:''}
    </div>
  </div>

  ${techActions}

  <div class="grid-2" style="margin-bottom:20px">
    <div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-header"><span class="card-title">📌 任務基本資訊</span></div>
        <div class="card-body">
          <div style="display:grid;grid-template-columns:100px 1fr;gap:10px;font-size:13px">
            <span style="color:var(--text-muted)">任務名稱</span><span style="font-weight:600;color:var(--text-primary)">${task.title}</span>
            <span style="color:var(--text-muted)">類別</span><span class="chip">${task.category}</span>
            <span style="color:var(--text-muted)">建立者</span><span>${task.requester}</span>
            <span style="color:var(--text-muted)">建立時間</span><span style="font-family:monospace;font-size:11px">${task.created}</span>
            <span style="color:var(--text-muted)">截止時間</span><span style="font-family:monospace;font-size:11px;color:${task.elapsed>task.slaHours?'var(--accent-red)':'var(--text-primary)'}">${task.deadline}</span>
            <span style="color:var(--text-muted)">SLA 狀態</span><span>${slaBar(task)}</span>
          </div>
        </div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-header"><span class="card-title">📝 任務描述</span></div>
        <div class="card-body">
          <p style="font-size:13px;color:var(--text-secondary);line-height:1.6">${task.desc}</p>
          <div class="divider"></div>
          <div style="display:flex;align-items:flex-start;gap:8px;font-size:13px">
            <span style="color:var(--text-muted);flex-shrink:0">📍 地點</span>
            <span>${task.location}</span>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">👥 指派人員</span>
        </div>
        <div class="card-body">
          <div style="display:flex;flex-direction:column;gap:10px">
            ${task.assignees.map(a=>{
              const u=DB.users.find(u=>u.name===a)||{avatar:a[0],dept:'—',phone:'—'};
              return `<div style="display:flex;align-items:center;gap:10px">
                <div class="avatar-sm" style="width:36px;height:36px;font-size:14px">${u.avatar||a[0]}</div>
                <div><div style="font-size:13px;font-weight:600">${a}</div>
                <div style="font-size:11px;color:var(--text-muted)">${u.dept} · ${u.phone}</div></div>
              </div>`;
            }).join('')}
          </div>
          ${isDispatcher&&task.status!=='completed'&&task.status!=='approved'?`<button class="btn btn-secondary btn-sm" style="margin-top:12px" onclick="reassignTask('${task.id}')">🔄 重新指派</button>`:''}
        </div>
      </div>
    </div>

    <div>
      ${task.materials.length?`
      <div class="card" style="margin-bottom:16px">
        <div class="card-header"><span class="card-title">🔩 使用材料/零件</span></div>
        <div class="card-body" style="padding:0">
          <table class="data-table">
            <thead><tr><th>品名</th><th>數量</th><th>單位</th></tr></thead>
            <tbody>${task.materials.map(m=>`<tr><td>${m.name}</td><td>${m.qty}</td><td>${m.partNo?`<span style="font-family:monospace;font-size:10px;color:var(--text-muted)">${m.partNo}</span> `:''}${m.unit}</td></tr>`).join('')}</tbody>
          </table>
        </div>
      </div>`:''}

      ${task.notes.length?`
      <div class="card" style="margin-bottom:16px">
        <div class="card-header"><span class="card-title">💬 工作備註/異常記錄</span></div>
        <div class="card-body">
          ${task.notes.map(n=>`<div style="background:rgba(255,71,87,0.08);border:1px solid rgba(255,71,87,0.2);border-radius:var(--radius);padding:12px;margin-bottom:8px">
            <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">${n.time} — ${n.user}</div>
            <div style="font-size:13px;color:var(--text-primary)">${n.text}</div>
          </div>`).join('')}
        </div>
      </div>`:''}

      ${myTask&&task.status!=='completed'&&task.status!=='approved'?`
      <div class="card" style="margin-bottom:16px">
        <div class="card-header"><span class="card-title">✍️ 新增工作備註</span></div>
        <div class="card-body">
          <textarea class="field-input" id="newNoteText" placeholder="記錄工作進度、問題或說明..." style="min-height:80px"></textarea>
          <button class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="addNote('${task.id}')">送出備註</button>
        </div>
      </div>`:''}

      <div class="card">
        <div class="card-header"><span class="card-title">📜 作業歷程</span></div>
        <div class="card-body">
          <div class="timeline">
            ${task.history.map(h=>`
              <div class="timeline-item">
                <div class="timeline-dot ${h.type==='anomaly'?'danger':h.type==='approve'||h.type==='complete'?'success':h.type==='create'||h.type==='system'?'active':''}"></div>
                <div class="timeline-time">${h.time}</div>
                <div class="timeline-text">${getTypeIcon(h.type)} <strong>${h.action}</strong> <span style="color:var(--text-muted)">— ${h.user}</span></div>
              </div>`).join('')}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function addNote(taskId){
  const task=DB.tasks.find(t=>t.id===taskId);
  const text=document.getElementById('newNoteText')?.value;
  if(!text)return;
  const now=new Date();
  const t=`${now.getMonth()+1}-${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  task.notes.push({time:t,user:DB.currentUser.name,text});
  task.history.push({time:t,action:`新增工作備註`,user:DB.currentUser.name,type:'system'});
  renderTaskDetail({id:taskId});
  showToast('備註已新增','success');
}

function updateTaskStatus(taskId,newStatus,actionText){
  const task=DB.tasks.find(t=>t.id===taskId);
  if(!task)return;
  task.status=newStatus;
  const now=new Date();
  const t=`${now.getMonth()+1}-${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  task.history.push({time:t,action:actionText,user:DB.currentUser.name,type:newStatus==='inprogress'?'start':newStatus==='paused'?'pause':newStatus});
  renderTaskDetail({id:taskId});
  showToast(`任務狀態已更新：${actionText}`,'success');
}

function acceptTask(taskId){
  updateTaskStatus(taskId,'accepted','接受任務');
}
function rejectTask(taskId){
  openModal('拒絕任務',`
    <div class="form-group">
      <label class="field-label">拒絕原因 <span class="required">*</span></label>
      <textarea class="field-input" id="rejectReason" placeholder="請說明無法接受此任務的原因..." style="min-height:100px"></textarea>
    </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">取消</button>
     <button class="btn btn-danger" onclick="confirmReject('${taskId}')">確認拒絕</button>`);
}
function confirmReject(taskId){
  const reason=document.getElementById('rejectReason')?.value;
  if(!reason){showToast('請填寫拒絕原因','danger');return;}
  const task=DB.tasks.find(t=>t.id===taskId);
  const now=new Date();
  const t=`${now.getMonth()+1}-${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const rejector=DB.currentUser.name;
  task.history.push({time:t,action:`${rejector} 拒絕任務：${reason}`,user:rejector,type:'reject'});
  // Remove this technician from assignees; keep task pending for reassignment
  task.assignees=task.assignees.filter(a=>a!==rejector);
  task.status='pending';
  task.needsReassign=true;
  // Notify dispatcher
  DB.notifications.unshift({id:'n'+Date.now(),title:'任務被拒絕，需重新指派',
    msg:`${taskId} 被 ${rejector} 拒絕。原因：${reason}`,
    time:'剛剛',type:'warning',read:false,taskId});
  renderNotifList();
  closeModal();
  showToast('任務已拒絕，派工管理員已接獲通知，請等待重新指派','warning');
  navigateTo('my-tasks');
}

function pauseTask(taskId){
  openModal('暫停作業',`
    <div class="form-group">
      <label class="field-label">暫停原因</label>
      <textarea class="field-input" id="pauseReason" placeholder="例如：等待零件、設備不足..." style="min-height:80px"></textarea>
    </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">取消</button>
     <button class="btn btn-warning" onclick="confirmPause('${taskId}')">確認暫停</button>`);
}
function confirmPause(taskId){
  const reason=document.getElementById('pauseReason')?.value||'未說明';
  const task=DB.tasks.find(t=>t.id===taskId);
  const now=new Date();
  const t=`${now.getMonth()+1}-${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  task.status='paused';
  task.notes.push({time:t,user:DB.currentUser.name,text:`暫停原因：${reason}`});
  task.history.push({time:t,action:`作業暫停 - ${reason}`,user:DB.currentUser.name,type:'pause'});
  closeModal();
  showToast('任務已暫停','warning');
  renderTaskDetail({id:taskId});
}

function reportAnomaly(taskId){
  openModal('⚠️ 異常通報',`
    <div class="form-group">
      <label class="field-label">異常描述 <span class="required">*</span></label>
      <textarea class="field-input" id="anomalyDesc" placeholder="詳細描述遇到的問題..." style="min-height:100px"></textarea>
    </div>
    <div class="form-group">
      <label class="field-label">照片上傳（可選）</label>
      <div class="upload-area"><div class="ua-icon">📸</div><p>上傳現場照片</p></div>
    </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">取消</button>
     <button class="btn btn-danger" onclick="confirmAnomaly('${taskId}')">🚨 送出異常通報</button>`);
}
function confirmAnomaly(taskId){
  const desc=document.getElementById('anomalyDesc')?.value;
  if(!desc){showToast('請填寫異常描述','danger');return;}
  const task=DB.tasks.find(t=>t.id===taskId);
  const now=new Date();
  const t=`${now.getMonth()+1}-${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  task.status='anomaly';
  task.notes.push({time:t,user:DB.currentUser.name,text:desc});
  task.history.push({time:t,action:`⚠️ 異常通報`,user:DB.currentUser.name,type:'anomaly'});
  DB.notifications.unshift({id:'n'+Date.now(),title:'⚠️ 緊急異常通報',msg:`${taskId} 發生異常：${desc.substring(0,40)}...`,time:'剛剛',type:'danger',read:false,taskId});
  renderNotifList();
  closeModal();
  showToast('異常通報已送出，管理員已接獲通知 🚨','danger');
  renderTaskDetail({id:taskId});
}

function resolveAnomaly(taskId){
  openModal('異常排除確認',`
    <div style="margin-bottom:12px;padding:12px;background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.3);border-radius:var(--radius);font-size:13px;color:var(--accent-green)">
      確認異常問題已排除，任務將恢復為「執行中」狀態。
    </div>
    <div class="form-group">
      <label class="field-label">排除說明（必填）</label>
      <textarea class="field-input" id="resolveDesc" placeholder="說明如何排除異常..." style="min-height:80px"></textarea>
    </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">取消</button>
     <button class="btn btn-success" onclick="confirmResolveAnomaly('${taskId}')">✅ 確認排除，恢復作業</button>`);
}
function confirmResolveAnomaly(taskId){
  const desc=document.getElementById('resolveDesc')?.value;
  if(!desc){showToast('請填寫排除說明','danger');return;}
  const task=DB.tasks.find(t=>t.id===taskId);
  const now=new Date();
  const t=`${now.getMonth()+1}-${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  task.status='inprogress';

function approveTask(taskId){

  const task=DB.tasks.find(t=>t.id===taskId);
  const now=new Date();
  const t=`${now.getMonth()+1}-${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  task.status='inprogress';
  task.history.push({time:t,action:`完工回報退回：${reason}。請重新執行並補充完整資料後再次提交`,user:DB.currentUser.name,type:'reject'});
  DB.notifications.unshift({id:'n'+Date.now(),title:'完工回報退回，請修正後重送',
    msg:`${taskId} 完工回報被退回。退回原因：${reason}。請修正後重新提交。`,

  closeModal();
  showToast('完工回報已退回，執行人員已接獲通知','warning');
  renderTaskDetail({id:taskId});
}

function editTask(taskId){
  const task=DB.tasks.find(t=>t.id===taskId);
  openModal(`編輯派工單 ${taskId}`,`

      <label class="field-label">任務名稱</label>
      <input class="field-input" id="et_title" value="${task.title}">

      <div><label class="field-label">優先順序</label>

          <option value="medium" ${task.priority==='medium'?'selected':''}>🟡 中優先</option>
          <option value="low" ${task.priority==='low'?'selected':''}>🟢 低優先</option>
        </select></div>
      <div><label class="field-label">截止時間</label>

function saveEdit(taskId){
  const task=DB.tasks.find(t=>t.id===taskId);
  task.title=document.getElementById('et_title')?.value||task.title;
  task.priority=document.getElementById('et_pri')?.value||task.priority;
  task.desc=document.getElementById('et_desc')?.value||task.desc;
  const dl=document.getElementById('et_deadline')?.value;
  if(dl)task.deadline=dl.replace('T',' ');

  const t=`${now.getMonth()+1}-${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

function reassignTask(taskId){
  const task=DB.tasks.find(t=>t.id===taskId);

  const idx=reassignSelected.indexOf(name);

  if(!reassignSelected.length){showToast('請選擇至少一位人員','danger');return;}

  task.assignees=reassignSelected.slice();

  renderNotifList();
  reassignSelected=[];

  showToast('人員指派已更新','success');
  renderTaskDetail({id:taskId});
}

// Chart instance registry — destroy before recreating to avoid "canvas in use" error
var _aC = {};
function aC(id, config){
  if(typeof Chart === 'undefined'){ console.warn('[DMS] Chart.js not loaded'); return; }
  if(_aC[id]){try{_aC[id].destroy();}catch(e){} delete _aC[id];}
  const canvas = document.getElementById(id);
  if(!canvas){ console.warn('[DMS] canvas not found:', id); return; }
  // Force container to have dimensions
  const wrap = canvas.closest('.chart-container');
  if(wrap){ canvas.style.width='100%'; canvas.style.height='100%'; }
  try{
    Chart.defaults.color = '#7ba3c9';
    Chart.defaults.borderColor = 'rgba(0,212,255,0.07)';
    _aC[id] = new Chart(canvas, config);
  }catch(e){ console.warn('[DMS] Chart error for',id,e); }
  return _aC[id];
}

function renderNotifications(){
  const el=document.getElementById('page-notifications');
  const unread=DB.notifications.filter(n=>!n.read);
  const read=DB.notifications.filter(n=>n.read);
  const iconMap={danger:'🔴',warning:'🟡',info:'🔵',success:'🟢'};
  const colorMap={danger:'rgba(255,71,87,0.15)',warning:'rgba(255,215,0,0.15)',info:'rgba(0,212,255,0.15)',success:'rgba(0,255,136,0.15)'};
  const borderMap={danger:'var(--accent-red)',warning:'var(--accent-yellow)',info:'var(--accent-cyan)',success:'var(--accent-green)'};
  const renderItems=(items,isUnread)=>items.map(n=>`
    <div class="card notif-page-card" style="margin-bottom:10px;border-left:3px solid ${isUnread?borderMap[n.type]:'transparent'};transition:var(--transition)">
      <div class="card-body" style="padding:14px;display:flex;gap:12px;align-items:center">
        <div style="width:42px;height:42px;border-radius:50%;background:${colorMap[n.type]};display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${iconMap[n.type]}</div>
        <div style="flex:1;cursor:pointer;min-width:0" onclick="markOneRead('${n.id}');openTaskFromNotif('${n.taskId}')">
          <div style="font-size:13px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px">
            ${n.title}
            ${isUnread?`<span class="badge badge-inprogress" style="font-size:10px">未讀</span>`:'<span style="font-size:10px;color:var(--text-muted)">已讀</span>'}
          </div>
          <div style="font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${n.msg}</div>
          <div style="font-size:10px;color:var(--text-muted);margin-top:5px">🕐 ${n.time}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">
          ${isUnread?`<button class="btn btn-sm btn-success" style="font-size:11px;padding:5px 10px" onclick="markOneRead('${n.id}');renderNotifications()">✓ 確認</button>`:''}
          <button class="btn btn-sm btn-danger" style="font-size:11px;padding:5px 10px" onclick="dismissNotif('${n.id}',event);renderNotifications()">✕ 刪除</button>
        </div>
      </div>
    </div>`).join('');
  el.innerHTML=`
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
    <div>
      <div class="section-title" style="margin-bottom:2px">🔔 通知中心</div>
      <div style="font-size:12px;color:var(--text-secondary)">共 ${DB.notifications.length} 則 · 未讀 <strong style="color:var(--accent-cyan)">${unread.length}</strong> 則</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary btn-sm" onclick="markAllRead()">✓ 全部標為已讀</button>
      <button class="btn btn-danger btn-sm" onclick="dismissAllRead()">🗑 清除已讀</button>
    </div>
  </div>
  ${unread.length?`
    <div style="font-size:11px;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px">未讀通知（${unread.length}）</div>
    ${renderItems(unread,true)}`:''}
  ${read.length?`
    <div style="font-size:11px;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;margin:${unread.length?'20px':0} 0 10px">已讀通知（${read.length}）</div>
    ${renderItems(read,false)}`:''}
  ${!DB.notifications.length?`<div class="empty-state"><div class="es-icon">🔔</div><p>沒有任何通知</p></div>`:''}`;
}
function dismissAllRead(){
  DB.notifications=DB.notifications.filter(n=>!n.read);
  renderNotifList();
  renderNotifications();
}

function saveNewUser(){
  const name=document.getElementById('nu_name')?.value;
  const email=document.getElementById('nu_email')?.value;
  if(!name||!email){showToast('請填寫必填欄位','danger');return;}
  const u={id:'u'+Date.now(),name,role:document.getElementById('nu_role')?.value||'technician',
    avatar:name[0],email,dept:document.getElementById('nu_dept')?.value||'技術部',
    phone:document.getElementById('nu_phone')?.value||'—',active:true};
  DB.users.push(u);
  closeModal();
  showToast(`${name} 已新增成功`,'success');
  renderTeam();
}
function toggleUser(id,name){
  const u=DB.users.find(u=>u.id===id);
  if(u){u.active=!u.active;showToast(`${name} 已${u.active?'啟用':'停用'}`,'warning');renderTeam();}
}

  const u=DB.users.find(u=>u.id===id);

function saveEditUser(id){
  const u=DB.users.find(u=>u.id===id);

}

// ============================================================
// TOAST
// ============================================================
function showToast(msg,type='info'){
  const colors={success:'var(--accent-green)',danger:'var(--accent-red)',warning:'var(--accent-yellow)',info:'var(--accent-cyan)'};
  const icons={success:'✅',danger:'🚨',warning:'⚠️',info:'ℹ️'};
  const toast=document.createElement('div');
  toast.style.cssText=`position:fixed;bottom:90px;right:20px;background:var(--bg-panel);border:1px solid ${colors[type]||colors.info};border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-primary);z-index:999;box-shadow:0 4px 20px rgba(0,0,0,0.4);max-width:340px;transform:translateX(100%);transition:transform 0.3s ease;`;
  toast.innerHTML=`<span>${icons[type]}</span><span>${msg}</span>`;
  document.body.appendChild(toast);
  setTimeout(()=>{toast.style.transform='translateX(0)';},10);
  setTimeout(()=>{toast.style.transform='translateX(120%)';setTimeout(()=>toast.remove(),300);},3500);
}

// 取得 Cesium Ion Token: https://cesium.com/ion/tokens

let _mapboxMap   = null;  // Mapbox GL map instance
let _cesiumViewer= null;  // Cesium Viewer instance
let _mbMarkers   = [];    // Mapbox markers array
let _csEntities  = [];    // Cesium entities array
let _gisLayers   = { techs:{}, tasks:{}, tracks:[], heatCircles:[] };
let _gisTab      = 'live';

// ── 動態載入外部資源 ──────────────────────────────────────────
function _loadDynScript(url, cb){
  if(document.querySelector(`script[src="${url}"]`)){ if(cb)setTimeout(cb,0); return; }
  const s=document.createElement('script'); s.src=url; s.onload=cb; document.head.appendChild(s);
}
function _loadDynCSS(url){
  if(document.querySelector(`link[href="${url}"]`)) return;
  const l=document.createElement('link'); l.rel='stylesheet'; l.href=url; document.head.appendChild(l);
}

// ── API Key 校驗 ──────────────────────────────────────────────
function _isKeyConfigured(key){ return key && !key.includes('YOUR_') && key.length > 10; }

// ── 銷毀所有地圖 ─────────────────────────────────────────────
function destroyAllGisMaps(){
  if(_gisMap)       { try{_gisMap.remove();}catch(e){} _gisMap=null; }
  if(_mapboxMap)    { try{_mapboxMap.remove();}catch(e){} _mapboxMap=null; }
  if(_cesiumViewer) { try{_cesiumViewer.destroy();}catch(e){} _cesiumViewer=null; }
  _mbMarkers=[]; _csEntities=[];
  _gisLayers = { techs:{}, tasks:{}, tracks:[], heatCircles:[] };
}

function switchGisPlatform(platform, btn){
  document.querySelectorAll('.gis-plat-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  _gisPlatform = platform;
  sessionStorage.setItem('dms_gis_platform', platform);
  destroyAllGisMaps();
  loadGisTab(_gisTab);
}

const GIS_COLORS = {
  inprogress:'#1a6fff', anomaly:'#ff4757', paused:'#ff6b35',
  accepted:'#00d4ff', pending:'#ffd700', completed:'#00ff88',

function makeDivIcon(color, pulse=false, size=14){
  const ring = pulse ? `<div class="gis-marker-ring gis-pulse" style="color:${color};width:${size}px;height:${size}px;"></div>` : '';
  return L.divIcon({
    className:'',
    html:`<div class="gis-marker-wrap" style="width:${size+10}px;height:${size+10}px">
      ${ring}
      <div class="gis-marker-dot" style="color:${color};background:${color};width:${size}px;height:${size}px;"></div>
    </div>`,
    iconSize:[size+10,size+10], iconAnchor:[(size+10)/2,(size+10)/2], popupAnchor:[0,-10]
  });
}
function makeTaskIcon(color){
  return L.divIcon({
    className:'',
    html:`<div style="width:28px;height:28px;position:relative">
      <div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:10px solid ${color}"></div>

    </div>`,
    iconSize:[28,32], iconAnchor:[14,32], popupAnchor:[0,-34]
  });
}

function switchGisTab(tab, el){
  document.querySelectorAll('#page-gis .tab-item').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  _gisTab = tab;
  loadGisTab(tab);
}

function loadGisTab(tab){
  const el = document.getElementById('gisTabContent');
  if(tab==='live')    renderGisLive(el);
  else if(tab==='track')   renderGisTrack(el);
  else if(tab==='records') renderGisRecords(el);
  else if(tab==='report')  renderGisReport(el);
}

// PLATFORM: LEAFLET (CartoDB Dark Matter)
// ═══════════════════════════════════════════════════════════
function initGisLiveMap(){
  if(_gisPlatform==='mapbox')  { initMapboxLiveMap(); return; }
  if(_gisPlatform==='cesium')  { initCesiumLiveMap(); return; }
  // Default: Leaflet
  if(_gisMap){ _gisMap.remove(); _gisMap=null; }
  _gisMap = L.map('gisMap',{zoomControl:true,attributionControl:true}).setView([25.04,121.565],12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    attribution:'© CartoDB © OpenStreetMap',maxZoom:19,subdomains:'abcd'
  }).addTo(_gisMap);
  // Task markers
  DB.tasks.forEach(t=>{
    const latLng=getTaskLatLng(t); if(!latLng) return;
    const color=GIS_COLORS[t.status]||'#7ba3c9';
    L.marker(latLng,{icon:makeTaskIcon(color)}).bindPopup(_taskPopupHtml(t)).addTo(_gisMap);
  });
  // Technician markers (latest location)
  const techLatest={};
  DB.gisLocations.forEach(l=>{techLatest[l.techId]=l;});
  Object.entries(techLatest).forEach(([tid,loc])=>{
    const user=DB.users.find(u=>u.id===tid); if(!user) return;
    const activeTasks=DB.tasks.filter(t=>t.assignees.includes(user.name)&&['inprogress','accepted','paused','anomaly'].includes(t.status));
    const status=activeTasks.length?activeTasks[0].status:'approved';
    const color=GIS_COLORS[status]||'#7ba3c9';
    const pulse=['inprogress','anomaly'].includes(status);
    const m=L.marker([loc.lat,loc.lng],{icon:makeDivIcon(color,pulse,16),zIndexOffset:1000}).addTo(_gisMap);
    _gisLayers.techs[tid]={marker:m,loc};
    m.bindPopup(_techPopupHtml(user,loc,activeTasks,color));
    m.openPopup(); setTimeout(()=>m.closePopup(),100);
  });
  setTimeout(()=>_gisMap.invalidateSize(),200);
}

// PLATFORM: MAPBOX GL JS
// ═══════════════════════════════════════════════════════════
function initMapboxLiveMap(){
  const token=GIS_API_CONFIG.mapboxToken;
  if(!_isKeyConfigured(token)){
    document.getElementById('gisMap').innerHTML=_apiNoticeHtml('mapbox');
    return;
  }
  const doInit=()=>{
    if(_mapboxMap){_mapboxMap.remove();_mapboxMap=null;} _mbMarkers=[];
    mapboxgl.accessToken=token;
    _mapboxMap=new mapboxgl.Map({
      container:'gisMap',
      style:'mapbox://styles/mapbox/dark-v11',
      center:[121.565,25.04], zoom:11.5
    });
    _mapboxMap.addControl(new mapboxgl.NavigationControl(),'top-right');
    _mapboxMap.addControl(new mapboxgl.ScaleControl({unit:'metric'}),'bottom-right');
    _mapboxMap.on('load',()=>{
      // Task markers
      DB.tasks.forEach(t=>{
        const latLng=getTaskLatLng(t); if(!latLng) return;
        const color=GIS_COLORS[t.status]||'#7ba3c9';
        const el=document.createElement('div');
        el.style.cssText=`width:28px;height:28px;background:${color};border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 0 10px ${color};cursor:pointer;border:2px solid rgba(255,255,255,0.3)`;
        el.textContent='📋';
        const popup=new mapboxgl.Popup({offset:20,className:'mapboxgl-popup-dms'}).setHTML(_taskPopupHtml(t));
        const mk=new mapboxgl.Marker({element:el}).setLngLat([latLng[1],latLng[0]]).setPopup(popup).addTo(_mapboxMap);
        _mbMarkers.push(mk);
      });
      // Technician markers
      const techLatest={};
      DB.gisLocations.forEach(l=>{techLatest[l.techId]=l;});
      Object.entries(techLatest).forEach(([tid,loc])=>{
        const user=DB.users.find(u=>u.id===tid); if(!user) return;
        const activeTasks=DB.tasks.filter(t=>t.assignees.includes(user.name)&&['inprogress','accepted','paused','anomaly'].includes(t.status));
        const status=activeTasks.length?activeTasks[0].status:'approved';
        const color=GIS_COLORS[status]||'#7ba3c9';
        const pulse=['inprogress','anomaly'].includes(status);
        const el=document.createElement('div');
        el.style.cssText=`width:22px;height:22px;border-radius:50%;background:${color};border:3px solid rgba(255,255,255,0.8);box-shadow:0 0 ${pulse?'16px':'8px'} ${color};cursor:pointer;`;
        if(pulse){ el.style.animation='gis-pulse-anim 1.8s ease-out infinite'; }
        const popup=new mapboxgl.Popup({offset:20}).setHTML(_techPopupHtml(user,loc,activeTasks,color));
        const mk=new mapboxgl.Marker({element:el}).setLngLat([loc.lng,loc.lat]).setPopup(popup).addTo(_mapboxMap);
        _gisLayers.techs[tid]={marker:mk,loc,mbMarker:mk};
        _mbMarkers.push(mk);
      });
    });
    showToast('Mapbox GL 地圖已載入','success');
  };
  if(typeof mapboxgl!=='undefined'){ doInit(); return; }
  _loadDynCSS('https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css');
  _loadDynScript('https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js',doInit);
  document.getElementById('gisMap').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);gap:10px"><span class="live-dot"></span> Mapbox GL JS 載入中…</div>';
}

// PLATFORM: CESIUM 3D (+ Google Maps Photorealistic Imagery)
// ═══════════════════════════════════════════════════════════
function initCesiumLiveMap(){
  const csToken=GIS_API_CONFIG.cesiumIonToken;
  const gmKey=GIS_API_CONFIG.googleMapsKey;
  if(!_isKeyConfigured(csToken)){
    document.getElementById('gisMap').innerHTML=_apiNoticeHtml('cesium');
    return;
  }
  const doInit=()=>{
    if(_cesiumViewer){try{_cesiumViewer.destroy();}catch(e){} _cesiumViewer=null;} _csEntities=[];
    Cesium.Ion.defaultAccessToken=csToken;
    _cesiumViewer=new Cesium.Viewer('gisMap',{
      animation:false, baseLayerPicker:_isKeyConfigured(gmKey)?false:true,
      fullscreenButton:false, geocoder:false, homeButton:true,
      infoBox:true, sceneModePicker:true, selectionIndicator:false,
      timeline:false, navigationHelpButton:false,
      terrainProvider: new Cesium.EllipsoidTerrainProvider()
    });
    // Google Maps 底圖整合
    if(_isKeyConfigured(gmKey)){
      // 移除預設底圖，改用 Google Maps 衛星影像
      _cesiumViewer.imageryLayers.removeAll();
      _cesiumViewer.imageryLayers.addImageryProvider(
        new Cesium.UrlTemplateImageryProvider({
          url:`https://maps.googleapis.com/maps/vt?lyrs=y&x={x}&y={y}&z={z}&key=${gmKey}`,
          credit:'Map data ©2024 Google',maximumLevel:20
        })
      );
      // 嘗試加入 Google Photorealistic 3D Tiles
      Cesium.createGooglePhotorealistic3DTileset({apiKey:gmKey}).then(tileset=>{
        _cesiumViewer.scene.primitives.add(tileset);
        showToast('Google 寫實 3D 圖磚已載入','success');
      }).catch(()=>{
        showToast('Google 衛星底圖已載入（3D 圖磚需 Maps Tiles API）','info');
      });
    }
    // 設定初始視角（台北）
    _cesiumViewer.camera.flyTo({
      destination:Cesium.Cartesian3.fromDegrees(121.565,25.04,80000),
      orientation:{heading:0,pitch:Cesium.Math.toRadians(-45),roll:0},
      duration:0
    });
    // 加入任務標記
    DB.tasks.forEach(t=>{
      const latLng=getTaskLatLng(t); if(!latLng) return;
      const color=GIS_COLORS[t.status]||'#7ba3c9';
      const entity=_cesiumViewer.entities.add({
        position:Cesium.Cartesian3.fromDegrees(latLng[1],latLng[0],50),
        billboard:{
          image:_cesiumPinSvg(color,'📋'),
          width:36,height:36,verticalOrigin:Cesium.VerticalOrigin.BOTTOM,
          heightReference:Cesium.HeightReference.CLAMP_TO_GROUND
        },
        label:{
          text:t.id,font:'10px sans-serif',fillColor:Cesium.Color.fromCssColorString('#7ba3c9'),
          pixelOffset:new Cesium.Cartesian2(0,-40),style:Cesium.LabelStyle.FILL_AND_OUTLINE,
          outlineColor:Cesium.Color.fromCssColorString('#050d1e'),outlineWidth:2,
          heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,
          disableDepthTestDistance:Number.POSITIVE_INFINITY
        },
        description:`<div style="background:#050d1e;color:#e0f0ff;padding:10px;font-family:sans-serif;font-size:12px">${_taskPopupHtml(t)}</div>`
      });
      _csEntities.push(entity);
    });
    // 加入技術人員標記
    const techLatest={};
    DB.gisLocations.forEach(l=>{techLatest[l.techId]=l;});
    Object.entries(techLatest).forEach(([tid,loc])=>{
      const user=DB.users.find(u=>u.id===tid); if(!user) return;
      const activeTasks=DB.tasks.filter(t=>t.assignees.includes(user.name)&&['inprogress','accepted','paused','anomaly'].includes(t.status));
      const status=activeTasks.length?activeTasks[0].status:'approved';
      const color=GIS_COLORS[status]||'#7ba3c9';
      const entity=_cesiumViewer.entities.add({
        position:Cesium.Cartesian3.fromDegrees(loc.lng,loc.lat,10),
        point:{
          pixelSize:14,color:Cesium.Color.fromCssColorString(color),
          outlineColor:Cesium.Color.WHITE,outlineWidth:2,
          heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,
          disableDepthTestDistance:Number.POSITIVE_INFINITY
        },
        label:{
          text:user.name,font:'bold 11px sans-serif',
          fillColor:Cesium.Color.fromCssColorString('#e0f0ff'),
          pixelOffset:new Cesium.Cartesian2(0,-22),
          style:Cesium.LabelStyle.FILL_AND_OUTLINE,
          outlineColor:Cesium.Color.fromCssColorString('#050d1e'),outlineWidth:2,
          heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,
          disableDepthTestDistance:Number.POSITIVE_INFINITY
        },
        description:`<div style="background:#050d1e;color:#e0f0ff;padding:10px;font-family:sans-serif;font-size:12px">${_techPopupHtml(user,loc,activeTasks,color)}</div>`
      });
      _gisLayers.techs[tid]={csEntity:entity,loc};
      _csEntities.push(entity);
    });
    showToast('Cesium 3D 地圖已載入','success');
  };
  if(typeof Cesium!=='undefined'){ doInit(); return; }
  _loadDynCSS('https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css');
  _loadDynScript('https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js',doInit);
  document.getElementById('gisMap').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);gap:10px"><span class="live-dot"></span> Cesium 3D 引擎載入中（約 5-10 秒）…</div>';
}

// Cesium 標記 SVG helper
function _cesiumPinSvg(color, emoji){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="36" height="40" viewBox="0 0 36 40">
    <path d="M18 0 C8 0 0 8 0 18 C0 30 18 40 18 40 C18 40 36 30 36 18 C36 8 28 0 18 0Z" fill="${color}"/>
    <circle cx="18" cy="18" r="10" fill="rgba(255,255,255,0.25)"/>
    <text x="18" y="23" text-anchor="middle" font-size="13">${emoji}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

// ── 平台感知：focusTech ────────────────────────────────────
function focusTech(techId){
  document.querySelectorAll('.tech-pin').forEach(p=>p.classList.remove('active'));
  const pin=document.getElementById('techpin-'+techId);
  if(pin) pin.classList.add('active');
  const lyr=_gisLayers.techs[techId];
  if(!lyr) return;
  if(_gisPlatform==='leaflet' && _gisMap && lyr.marker){
    _gisMap.setView([lyr.loc.lat,lyr.loc.lng],15,{animate:true});
    lyr.marker.openPopup();
  } else if(_gisPlatform==='mapbox' && _mapboxMap && lyr.mbMarker){
    _mapboxMap.flyTo({center:[lyr.loc.lng,lyr.loc.lat],zoom:15});
    lyr.mbMarker.togglePopup();
  } else if(_gisPlatform==='cesium' && _cesiumViewer && lyr.csEntity){
    _cesiumViewer.camera.flyTo({
      destination:Cesium.Cartesian3.fromDegrees(lyr.loc.lng,lyr.loc.lat,2000),
      orientation:{heading:0,pitch:Cesium.Math.toRadians(-45),roll:0},duration:1.5
    });
    _cesiumViewer.selectedEntity=lyr.csEntity;
  }
}

function getTaskLatLng(task){
  // Approximate coordinates from location strings
  const map = {
    '信義區': [25.0336,121.5645], '內湖': [25.0752,121.6066],
    '板橋': [25.0169,121.4628], '汐止': [25.0656,121.6562],
    '新店': [24.9685,121.5430], '松山': [25.0494,121.5574],
    '中正': [25.0440,121.5198], '台中': [24.1477,120.6736]
  };
  for(const [k,v] of Object.entries(map)){
    if(task.location.includes(k)) return v;
  }
  return [25.0+Math.random()*0.08, 121.52+Math.random()*0.12];
}

<script>

        <div class="card-header"><span class="card-title" id="trackTitle">軌跡時間軸</span></div>
        <div id="trackTimeline" style="overflow-y:auto;padding:12px;flex:1"></div>
      </div>
      <div class="card">
        <div class="card-body" style="padding:12px">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px" id="trackStats"></div>

function initTrackBaseMap(){
  if(_gisPlatform==='mapbox'){
    const token=GIS_API_CONFIG.mapboxToken;
    if(!_isKeyConfigured(token)){document.getElementById('gisMap').innerHTML=_apiNoticeHtml('mapbox');return;}
    const doMb=()=>{
      if(_mapboxMap){_mapboxMap.remove();_mapboxMap=null;} _mbMarkers=[];
      mapboxgl.accessToken=token;
      _mapboxMap=new mapboxgl.Map({container:'gisMap',style:'mapbox://styles/mapbox/dark-v11',center:[121.565,25.04],zoom:11});
      _mapboxMap.addControl(new mapboxgl.NavigationControl(),'top-right');
    };
    if(typeof mapboxgl!=='undefined'){doMb();}
    else{_loadDynCSS('https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css');_loadDynScript('https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js',doMb);}
    return;
  }
  if(_gisPlatform==='cesium'){
    const csToken=GIS_API_CONFIG.cesiumIonToken;
    if(!_isKeyConfigured(csToken)){document.getElementById('gisMap').innerHTML=_apiNoticeHtml('cesium');return;}
    const doCs=()=>{
      if(_cesiumViewer){try{_cesiumViewer.destroy();}catch(e){}_cesiumViewer=null;} _csEntities=[];
      Cesium.Ion.defaultAccessToken=csToken;
      _cesiumViewer=new Cesium.Viewer('gisMap',{animation:false,baseLayerPicker:false,fullscreenButton:false,geocoder:false,homeButton:true,infoBox:false,sceneModePicker:true,selectionIndicator:false,timeline:false,navigationHelpButton:false,terrainProvider:new Cesium.EllipsoidTerrainProvider()});
      if(_isKeyConfigured(GIS_API_CONFIG.googleMapsKey)){
        _cesiumViewer.imageryLayers.removeAll();
        _cesiumViewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:`https://maps.googleapis.com/maps/vt?lyrs=y&x={x}&y={y}&z={z}&key=${GIS_API_CONFIG.googleMapsKey}`,credit:'Google Maps',maximumLevel:20}));
      }
      _cesiumViewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(121.565,25.04,80000),orientation:{heading:0,pitch:Cesium.Math.toRadians(-45),roll:0},duration:0});
    };
    if(typeof Cesium!=='undefined'){doCs();}
    else{_loadDynCSS('https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css');_loadDynScript('https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js',doCs);}
    return;
  }
  // Default: Leaflet
  if(_gisMap){ _gisMap.remove(); _gisMap=null; }
  _gisMap = L.map('gisMap',{zoomControl:true}).setView([25.04,121.565],12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    attribution:'© CartoDB © OpenStreetMap',maxZoom:19,subdomains:'abcd'
  }).addTo(_gisMap);
}

function renderGisTrackForTech(techId){
  if(!techId) return;
  const dateFilter = document.getElementById('trackDate')?.value||'';
  const taskFilter = document.getElementById('trackTask')?.value||'';
  const user = DB.users.find(u=>u.id===techId);
  if(!user) return;
  // Require a map to be ready for the current platform
  const mapReady = (_gisPlatform==='leaflet'&&_gisMap)||(_gisPlatform==='mapbox'&&_mapboxMap&&_mapboxMap.loaded())||(_gisPlatform==='cesium'&&_cesiumViewer);
  if(!mapReady){ setTimeout(()=>renderGisTrackForTech(techId),400); return; }

  // Clear old layers (Leaflet)
  if(_gisPlatform==='leaflet'){
    if(_gisLayers.tracks) _gisLayers.tracks.forEach(l=>{ try{_gisMap.removeLayer(l);}catch(e){} });
    _gisLayers.tracks=[];
  }
  // Clear old layers (Mapbox)
  if(_gisPlatform==='mapbox'){
    _mbMarkers.forEach(m=>m.remove()); _mbMarkers=[];
    if(_mapboxMap.getSource('track-line')){ _mapboxMap.removeLayer('track-line-layer'); _mapboxMap.removeSource('track-line'); }
  }
  // Clear old layers (Cesium)
  if(_gisPlatform==='cesium'){
    _csEntities.forEach(e=>{ try{_cesiumViewer.entities.remove(e);}catch(ex){} }); _csEntities=[];
  }

  let locs = DB.gisLocations.filter(l=>l.techId===techId);
  if(dateFilter) locs = locs.filter(l=>l.timestamp.startsWith(dateFilter));
  if(taskFilter) locs = locs.filter(l=>l.taskId===taskFilter);
  locs = locs.sort((a,b)=>a.timestamp.localeCompare(b.timestamp));

  if(!locs.length){
    document.getElementById('trackTimeline').innerHTML='<div class="empty-state"><div class="es-icon">📍</div><p>無軌跡記錄</p></div>';
    return;
  }

  // ── LEAFLET track ────────────────────────────────────────
  if(_gisPlatform==='leaflet'){
    const pts=locs.map(l=>[l.lat,l.lng]);
    const poly=L.polyline(pts,{color:GIS_COLORS['inprogress'],weight:2.5,opacity:0.7,dashArray:'6,4'}).addTo(_gisMap);
    _gisLayers.tracks.push(poly);
    locs.forEach((loc,i)=>{
      const color=GIS_COLORS[loc.type]||'#00d4ff';
      const isFirst=i===0,isLast=i===locs.length-1;
      const size=(isFirst||isLast)?18:12;
      const m=L.marker([loc.lat,loc.lng],{icon:makeDivIcon(color,false,size)}).addTo(_gisMap);
      m.bindPopup(`<div style="min-width:180px">
        <div style="font-size:12px;font-weight:700;color:${color}">${ACTION_ICON[loc.type]||'📌'} ${loc.action}</div>
        <div style="font-size:11px;color:#7ba3c9;margin-top:4px">🕐 ${loc.timestamp}</div>
        <div style="font-size:11px;color:#7ba3c9">📍 ${loc.address}</div>
        <div style="font-size:11px;color:#7ba3c9">📋 ${loc.taskId}</div>
      </div>`);
      _gisLayers.tracks.push(m);
    });
    _gisMap.fitBounds(poly.getBounds(),{padding:[40,40]});
    _gisMap.invalidateSize();
  }

  // ── MAPBOX track ─────────────────────────────────────────
  if(_gisPlatform==='mapbox' && _mapboxMap){
    const coords=locs.map(l=>[l.lng,l.lat]);
    const addTrackToMapbox=()=>{
      if(_mapboxMap.getSource('track-line')){ _mapboxMap.removeLayer('track-line-layer'); _mapboxMap.removeSource('track-line'); }
      _mapboxMap.addSource('track-line',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:coords}}});
      _mapboxMap.addLayer({id:'track-line-layer',type:'line',source:'track-line',layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'#1a6fff','line-width':3,'line-dasharray':[2,1],'line-opacity':0.8}});
      locs.forEach((loc,i)=>{
        const color=GIS_COLORS[loc.type]||'#00d4ff';
        const isFirst=i===0,isLast=i===locs.length-1;
        const sz=(isFirst||isLast)?16:10;
        const el=document.createElement('div');
        el.style.cssText=`width:${sz}px;height:${sz}px;border-radius:50%;background:${color};border:2px solid rgba(255,255,255,0.8);box-shadow:0 0 8px ${color};cursor:pointer`;
        const popup=new mapboxgl.Popup({offset:15}).setHTML(`<div style="font-size:11px;color:#7ba3c9;padding:4px"><b style="color:${color}">${ACTION_ICON[loc.type]||'📌'} ${loc.action}</b><br>${loc.timestamp}<br>${loc.address}</div>`);
        const mk=new mapboxgl.Marker({element:el}).setLngLat([loc.lng,loc.lat]).setPopup(popup).addTo(_mapboxMap);
        _mbMarkers.push(mk);
      });
      if(coords.length>1){
        const bounds=coords.reduce((b,c)=>b.extend(c),new mapboxgl.LngLatBounds(coords[0],coords[0]));
        _mapboxMap.fitBounds(bounds,{padding:60,duration:1000});
      }
    };
    if(_mapboxMap.loaded()){addTrackToMapbox();}
    else{_mapboxMap.once('load',addTrackToMapbox);}
  }

  // ── CESIUM track ──────────────────────────────────────────
  if(_gisPlatform==='cesium' && _cesiumViewer){
    const positions=locs.map(l=>Cesium.Cartesian3.fromDegrees(l.lng,l.lat,10));
    if(positions.length>1){
      const lineEntity=_cesiumViewer.entities.add({
        polyline:{positions,width:3,material:new Cesium.PolylineDashMaterialProperty({color:Cesium.Color.fromCssColorString('#1a6fff'),dashLength:12}),clampToGround:true}
      });
      _csEntities.push(lineEntity);
    }
    locs.forEach((loc,i)=>{
      const color=GIS_COLORS[loc.type]||'#00d4ff';
      const isFirst=i===0,isLast=i===locs.length-1;
      const e=_cesiumViewer.entities.add({
        position:Cesium.Cartesian3.fromDegrees(loc.lng,loc.lat,20),
        point:{pixelSize:(isFirst||isLast)?16:10,color:Cesium.Color.fromCssColorString(color),outlineColor:Cesium.Color.WHITE,outlineWidth:2,heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,disableDepthTestDistance:Number.POSITIVE_INFINITY},
        label:{text:ACTION_ICON[loc.type]||'📌',font:'12px sans-serif',fillColor:Cesium.Color.WHITE,pixelOffset:new Cesium.Cartesian2(0,-20),heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,disableDepthTestDistance:Number.POSITIVE_INFINITY}
      });
      _csEntities.push(e);
    });
    if(positions.length>0){
      _cesiumViewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(locs[0].lng,locs[0].lat,8000),orientation:{heading:0,pitch:Cesium.Math.toRadians(-45),roll:0},duration:1.5});
    }
  }

  // Timeline
  const tasks = [...new Set(locs.map(l=>l.taskId))];
  document.getElementById('trackTitle').textContent=`${user.name} 軌跡時間軸 (${locs.length}點)`;
  document.getElementById('trackTimeline').innerHTML=locs.map((l,i)=>`
  <div class="track-point" onclick="gisMapFlyTo(${l.lat},${l.lng},16)" style="cursor:pointer">
    <div class="track-dot" style="background:${GIS_COLORS[l.type]||'#00d4ff'}"></div>
    <div style="flex:1">
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:2px">${l.timestamp}</div>
      <div style="font-size:12px;font-weight:600">${ACTION_ICON[l.type]||'📌'} ${l.action}</div>
      <div style="font-size:11px;color:var(--text-secondary)">${l.address}</div>
      <div style="display:flex;gap:6px;margin-top:3px">
        <span class="chip" style="font-size:9px">${l.taskId}</span>
        <span style="font-size:10px;color:var(--text-muted)">📱${l.device}</span>
      </div>
    </div>
  </div>`).join('');

  // Stats
  document.getElementById('trackStats').innerHTML=`
  <div style="background:rgba(0,212,255,0.05);border:1px solid var(--border);border-radius:6px;padding:8px">
    <div style="font-size:18px;font-weight:700;color:var(--accent-cyan)">${locs.length}</div>
    <div style="font-size:10px;color:var(--text-muted)">打卡點數</div>
  </div>
  <div style="background:rgba(0,212,255,0.05);border:1px solid var(--border);border-radius:6px;padding:8px">
    <div style="font-size:18px;font-weight:700;color:var(--accent-green)">${tasks.length}</div>
    <div style="font-size:10px;color:var(--text-muted)">涉及任務</div>
  </div>

function filterGisRecords(){
  const search=(document.getElementById('glSearch')?.value||'').toLowerCase();
  const tech=document.getElementById('glTech')?.value||'';
  const type=document.getElementById('glType')?.value||'';
  const date=document.getElementById('glDate')?.value||'';
  const task=document.getElementById('glTask')?.value||'';
  let locs=[...DB.gisLocations].reverse();
  if(search) locs=locs.filter(l=>l.techName.includes(search)||l.address.toLowerCase().includes(search)||l.taskId.includes(search)||l.action.includes(search));
  if(tech)   locs=locs.filter(l=>l.techId===tech);
  if(type)   locs=locs.filter(l=>l.type===type);
  if(date)   locs=locs.filter(l=>l.timestamp.startsWith(date));
  if(task)   locs=locs.filter(l=>l.taskId===task);
  const el=document.getElementById('glCount'); if(el)el.textContent=locs.length;
  const tbody=document.getElementById('glBody');
  if(!tbody)return;
  const typeColor={arrive:'var(--accent-cyan)',checkin:'var(--accent-blue)',checkout:'var(--accent-green)',depart:'var(--accent-purple)',pause:'var(--accent-orange)',anomaly:'var(--accent-red)'};
  tbody.innerHTML=locs.map(l=>`<tr>
    <td style="font-family:monospace;font-size:10px;color:var(--text-muted)">${l.id}</td>
    <td><div style="display:flex;align-items:center;gap:6px">
      <div class="avatar-sm">${l.techName[0]}</div>${l.techName}</div></td>
    <td><span style="font-family:monospace;font-size:11px;color:var(--accent-cyan)">${l.taskId}</span></td>
    <td><span style="color:${typeColor[l.type]||'#7ba3c9'}">${ACTION_ICON[l.type]||'📌'} ${l.action}</span></td>
    <td style="max-width:200px;font-size:11px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${l.address}">${l.address}</td>
    <td style="font-family:monospace;font-size:10px;color:var(--text-muted)">${l.lat.toFixed(4)}, ${l.lng.toFixed(4)}</td>
    <td style="font-family:monospace;font-size:11px;white-space:nowrap">${l.timestamp}</td>
    <td style="font-size:11px;color:var(--text-muted)">${l.device}</td>
    <td><div style="display:flex;gap:4px">
      <button class="btn btn-secondary btn-sm" onclick="gisViewOnMap('${l.id}')">🗺️</button>
      <button class="btn btn-secondary btn-sm" onclick="navigateTo('task-detail',{id:'${l.taskId}'})">📋</button>
    </div></td>
  </tr>`).join('')||`<tr><td colspan="9"><div class="empty-state"><div class="es-icon">📭</div><p>無符合記錄</p></div></td></tr>`;
}

// ── 平台感知：地圖飛行定位 ───────────────────────────────────
function gisMapFlyTo(lat, lng, zoom){
  if(_gisPlatform==='leaflet'&&_gisMap)       _gisMap.setView([lat,lng],zoom||15,{animate:true});
  else if(_gisPlatform==='mapbox'&&_mapboxMap) _mapboxMap.flyTo({center:[lng,lat],zoom:zoom||15});
  else if(_gisPlatform==='cesium'&&_cesiumViewer){
    _cesiumViewer.camera.flyTo({
      destination:Cesium.Cartesian3.fromDegrees(lng,lat,1500),
      orientation:{heading:0,pitch:Cesium.Math.toRadians(-45),roll:0},duration:1.2
    });
  }
}

function gisViewOnMap(locId){
  const loc=DB.gisLocations.find(l=>l.id===locId);
  if(!loc) return;
  switchGisTab('live',document.getElementById('gis-tab-live'));
  setTimeout(()=>gisMapFlyTo(loc.lat,loc.lng,16),500);
}

function saveCheckin(){
  const taskId = document.getElementById('ck_task')?.value;
  const addr = document.getElementById('ck_addr')?.value;
  const lat = parseFloat(document.getElementById('ck_lat')?.value);
  const lng = parseFloat(document.getElementById('ck_lng')?.value);
  const type = document.getElementById('ck_type')?.value||'checkin';
  const time = document.getElementById('ck_time')?.value?.replace('T',' ')||'';
  const device = document.getElementById('ck_device')?.value||'Web Browser';
  if(!taskId||!addr||isNaN(lat)||isNaN(lng)){showToast('請填寫必填欄位','danger');return;}
  const task = DB.tasks.find(t=>t.id===taskId);
  const actionMap={arrive:'到達現場',checkin:'作業打卡',checkout:'完工離場',depart:'出發前往',pause:'作業暫停'};
  const newLoc={
    id:'GL'+String(Date.now()).slice(-6),
    techId:DB.users.find(u=>u.name===DB.currentUser.name)?.id||'u2',
    techName:DB.currentUser.name,
    taskId,lat,lng,address:addr,
    timestamp:time,
    action:actionMap[type]||type,type,device
  };
  DB.gisLocations.push(newLoc);
  const now=new Date();
  const t=`${now.getMonth()+1}-${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  if(task) task.history.push({time:t,action:`📍 ${actionMap[type]||type} — ${addr}`,user:DB.currentUser.name,type:'system'});
  DB.notifications.unshift({id:'n'+Date.now(),title:`📍 打卡記錄`,
    msg:`${DB.currentUser.name} 在 ${addr} 完成${actionMap[type]||type}`,time:'剛剛',type:'info',read:false,taskId});
  renderNotifList();
  closeModal();
  showToast(`打卡成功：${actionMap[type]} at ${addr}`,'success');
  // Refresh current GIS tab
  loadGisTab(_gisTab);
}
