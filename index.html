<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DMS 派工管理系統</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* GIS OVERRIDES */
.leaflet-container{background:#050d1e!important;}
.leaflet-popup-content-wrapper{background:rgba(10,22,48,0.97)!important;border:1px solid rgba(0,212,255,0.5)!important;border-radius:10px!important;color:#e0f0ff!important;box-shadow:0 0 20px rgba(0,212,255,0.3)!important;}
.leaflet-popup-tip{background:rgba(10,22,48,0.97)!important;}
.leaflet-popup-close-button{color:#7ba3c9!important;}
.leaflet-control-attribution{background:rgba(5,13,30,0.8)!important;color:#4a6a8a!important;font-size:10px!important;}
.leaflet-control-zoom a{background:rgba(10,22,48,0.9)!important;color:#00d4ff!important;border-color:rgba(0,212,255,0.3)!important;}
.leaflet-control-zoom a:hover{background:rgba(0,212,255,0.15)!important;}
.gis-pulse{animation:gis-pulse-anim 1.8s ease-out infinite;}
@keyframes gis-pulse-anim{0%{transform:scale(1);opacity:1;}70%{transform:scale(2.5);opacity:0;}100%{transform:scale(1);opacity:0;}}
.gis-marker-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
.gis-marker-dot{width:14px;height:14px;border-radius:50%;border:2.5px solid rgba(255,255,255,0.9);box-shadow:0 0 10px currentColor;cursor:pointer;}
.gis-marker-ring{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid currentColor;opacity:0.6;}
/* GIS Platform Switcher */
.gis-platform-bar{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.gis-plat-btn{display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);}
.gis-plat-btn:hover{border-color:rgba(0,212,255,0.4);color:var(--text-secondary);}
.gis-plat-btn.active{background:rgba(0,212,255,0.12);border-color:var(--accent-cyan);color:var(--accent-cyan);}
.gis-plat-btn.plat-mapbox.active{background:rgba(123,47,247,0.12);border-color:#7b2ff7;color:#c4a8ff;}
.gis-plat-btn.plat-cesium.active{background:rgba(255,128,0,0.1);border-color:#ff8c00;color:#ffb347;}
.gis-api-notice{background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.3);border-radius:8px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:flex-start;gap:10px;font-size:12px;}
.gis-api-notice a{color:var(--accent-cyan);text-decoration:underline;}
.gis-key-input-wrap{background:rgba(0,212,255,0.04);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px;}
/* GIS Layout */
.gis-layout{display:flex;gap:16px;height:calc(100vh - 165px);min-height:500px;}
.gis-map-wrap{flex:1;min-width:0;position:relative;}
#gisMap{width:100%;height:100%;border-radius:10px;border:1px solid rgba(0,212,255,0.3);}
.gis-sidebar{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:12px;overflow-y:auto;}
@media(max-width:900px){.gis-layout{flex-direction:column;height:auto;}.gis-map-wrap{height:360px;}.gis-sidebar{width:100%;}}
/* Mapbox GL overrides */
.mapboxgl-map{border-radius:10px!important;border:1px solid rgba(0,212,255,0.3)!important;}
.mapboxgl-popup-content{background:rgba(10,22,48,0.97)!important;border:1px solid rgba(0,212,255,0.5)!important;border-radius:10px!important;color:#e0f0ff!important;padding:12px!important;}
.mapboxgl-popup-tip{border-top-color:rgba(10,22,48,0.97)!important;border-bottom-color:rgba(10,22,48,0.97)!important;}
.mapboxgl-ctrl-group{background:rgba(10,22,48,0.9)!important;border:1px solid rgba(0,212,255,0.3)!important;}
.mapboxgl-ctrl-group button{background:transparent!important;color:#00d4ff!important;}
.mapboxgl-ctrl-attrib{background:rgba(5,13,30,0.8)!important;font-size:10px!important;}
/* Cesium overrides */
#gisMap .cesium-viewer{border-radius:10px!important;overflow:hidden!important;}
#gisMap .cesium-viewer-bottom{display:none!important;}
#gisMap .cesium-viewer-toolbar{background:rgba(10,22,48,0.85)!important;border:1px solid rgba(0,212,255,0.25)!important;border-radius:8px!important;}
#gisMap .cesium-button{color:#00d4ff!important;}
#gisMap .cesium-performanceDisplay-defaultContainer{color:#7ba3c9!important;}
.tech-pin{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius);border:1px solid var(--border);cursor:pointer;transition:var(--transition);background:rgba(0,212,255,0.03);}
.tech-pin:hover,.tech-pin.active{border-color:var(--accent-cyan);background:rgba(0,212,255,0.08);}
.pin-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.gis-legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary);}
.gis-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.track-point{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid rgba(0,212,255,0.06);}
.track-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:2px;}
</style>
<style>
:root {
  --bg-primary: #050d1e;
  --bg-secondary: #0a1628;
  --bg-panel: rgba(10,22,48,0.92);
  --bg-card: rgba(13,26,58,0.85);
  --accent-cyan: #00d4ff;
  --accent-blue: #1a6fff;
  --accent-purple: #7b2ff7;
  --accent-green: #00ff88;
  --accent-yellow: #ffd700;
  --accent-red: #ff4757;
  --accent-orange: #ff6b35;
  --text-primary: #e0f0ff;
  --text-secondary: #7ba3c9;
  --text-muted: #4a6a8a;
  --border: rgba(0,212,255,0.25);
  --border-bright: rgba(0,212,255,0.6);
  --sidebar-w: 240px;
  --sidebar-w-collapsed: 64px;
  --header-h: 60px;
  --glow-cyan: 0 0 20px rgba(0,212,255,0.4);
  --glow-blue: 0 0 20px rgba(26,111,255,0.4);
  --radius: 8px;
  --transition: all 0.25s ease;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(26,111,255,0.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(123,47,247,0.06) 0%,transparent 60%);pointer-events:none;z-index:0;}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg-secondary);}
::-webkit-scrollbar-thumb{background:rgba(0,212,255,0.3);border-radius:3px;}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--bg-primary);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.login-box{background:var(--bg-card);border:1px solid var(--border-bright);border-radius:16px;padding:48px 40px;width:100%;max-width:440px;box-shadow:var(--glow-cyan),0 20px 60px rgba(0,0,0,0.5);position:relative;overflow:hidden;}
.login-box::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent 0deg,rgba(0,212,255,0.03) 60deg,transparent 120deg);animation:rotate 8s linear infinite;pointer-events:none;}
@keyframes rotate{to{transform:rotate(360deg);}}
.login-logo{text-align:center;margin-bottom:32px;}
.login-logo .logo-icon{width:64px;height:64px;background:linear-gradient(135deg,var(--accent-blue),var(--accent-cyan));border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:12px;box-shadow:var(--glow-cyan);}
.login-logo h1{font-size:22px;font-weight:700;letter-spacing:3px;color:var(--accent-cyan);}
.login-logo p{font-size:12px;color:var(--text-secondary);margin-top:4px;letter-spacing:2px;}
.form-group{margin-bottom:20px;}
.form-group label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:8px;letter-spacing:1px;text-transform:uppercase;}
.form-input{width:100%;background:rgba(0,212,255,0.05);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;color:var(--text-primary);font-size:14px;outline:none;transition:var(--transition);}
.form-input:focus{border-color:var(--accent-cyan);box-shadow:0 0 0 3px rgba(0,212,255,0.1);}
.form-input option{background:var(--bg-secondary);}
.role-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
.role-card{background:rgba(0,212,255,0.04);border:1px solid var(--border);border-radius:var(--radius);padding:14px 8px;text-align:center;cursor:pointer;transition:var(--transition);}
.role-card:hover,.role-card.active{border-color:var(--accent-cyan);background:rgba(0,212,255,0.1);box-shadow:var(--glow-cyan);}
.role-card .role-icon{font-size:24px;display:block;margin-bottom:6px;}
.role-card .role-name{font-size:11px;color:var(--text-secondary);}
.role-card.active .role-name{color:var(--accent-cyan);}
.btn-login{width:100%;background:linear-gradient(135deg,var(--accent-blue),var(--accent-cyan));border:none;border-radius:var(--radius);padding:14px;color:#fff;font-size:15px;font-weight:600;letter-spacing:2px;cursor:pointer;transition:var(--transition);}
.btn-login:hover{transform:translateY(-2px);box-shadow:var(--glow-cyan);}

/* LAYOUT */
#app{display:none;height:100vh;flex-direction:column;}
#app.visible{display:flex;}
.main-layout{display:flex;flex:1;overflow:hidden;}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:var(--transition);position:relative;z-index:100;flex-shrink:0;}
.sidebar.collapsed{width:var(--sidebar-w-collapsed);}
.sidebar-header{height:var(--header-h);display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);gap:10px;flex-shrink:0;}
.sidebar-logo{width:36px;height:36px;background:linear-gradient(135deg,var(--accent-blue),var(--accent-cyan));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;box-shadow:var(--glow-cyan);}
.sidebar-title{font-size:13px;font-weight:700;letter-spacing:2px;color:var(--accent-cyan);white-space:nowrap;overflow:hidden;}
.sidebar.collapsed .sidebar-title{display:none;}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 8px;}
.nav-section{margin-bottom:8px;}
.nav-section-label{font-size:10px;letter-spacing:2px;color:var(--text-muted);padding:8px 8px 4px;text-transform:uppercase;white-space:nowrap;overflow:hidden;}
.sidebar.collapsed .nav-section-label{visibility:hidden;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:var(--radius);cursor:pointer;transition:var(--transition);color:var(--text-secondary);font-size:13px;position:relative;white-space:nowrap;overflow:hidden;}
.nav-item:hover{background:rgba(0,212,255,0.08);color:var(--text-primary);}
.nav-item.active{background:rgba(0,212,255,0.15);color:var(--accent-cyan);border-left:3px solid var(--accent-cyan);}
.nav-item .nav-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center;}
.nav-item .nav-badge{margin-left:auto;background:var(--accent-red);color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;flex-shrink:0;}
.sidebar.collapsed .nav-item span:not(.nav-icon){display:none;}
.sidebar.collapsed .nav-badge{position:absolute;top:6px;right:6px;padding:2px 4px;}
.sidebar-footer{padding:12px 8px;border-top:1px solid var(--border);}
.user-info{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius);background:rgba(0,212,255,0.05);}
.user-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent-blue),var(--accent-purple));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.user-details{overflow:hidden;}
.user-name{font-size:13px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-role{font-size:11px;color:var(--text-secondary);}
.sidebar.collapsed .user-details{display:none;}

/* HEADER */
.top-header{height:var(--header-h);background:var(--bg-panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0;z-index:50;}
.toggle-btn{width:36px;height:36px;background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:var(--transition);flex-shrink:0;}
.toggle-btn:hover{border-color:var(--accent-cyan);color:var(--accent-cyan);}
.breadcrumb{flex:1;font-size:14px;color:var(--text-secondary);}
.breadcrumb span{color:var(--accent-cyan);}
.header-actions{display:flex;align-items:center;gap:10px;}
.notif-btn{position:relative;width:36px;height:36px;background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:var(--transition);}
.notif-btn:hover{border-color:var(--accent-cyan);color:var(--accent-cyan);}
.notif-badge{position:absolute;top:-4px;right:-4px;background:var(--accent-red);color:#fff;font-size:10px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.header-search{display:flex;align-items:center;gap:8px;background:rgba(0,212,255,0.05);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px;transition:var(--transition);}
.header-search:focus-within{border-color:var(--accent-cyan);}
.header-search input{background:transparent;border:none;color:var(--text-primary);font-size:13px;outline:none;width:180px;}
.header-search input::placeholder{color:var(--text-muted);}
@media(max-width:768px){.header-search{display:none;}}

/* CONTENT */
.content-area{flex:1;overflow-y:auto;padding:20px;}
.page{display:none;}
.page.active{display:block;}

/* CARDS & PANELS */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.card-title{font-size:14px;font-weight:600;letter-spacing:1px;color:var(--text-primary);}
.card-body{padding:20px;}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px;}
.kpi-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden;transition:var(--transition);}
.kpi-card:hover{border-color:var(--border-bright);transform:translateY(-2px);}
.kpi-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--kpi-color,var(--accent-cyan)),transparent);}
.kpi-label{font-size:11px;color:var(--text-secondary);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.kpi-value{font-size:32px;font-weight:700;color:var(--text-primary);line-height:1;}
.kpi-sub{font-size:12px;color:var(--text-muted);margin-top:6px;}
.kpi-icon{position:absolute;right:16px;top:16px;font-size:32px;opacity:0.15;}
.kpi-trend{display:inline-flex;align-items:center;gap:4px;font-size:12px;margin-top:8px;padding:2px 8px;border-radius:20px;}
.kpi-trend.up{color:var(--accent-green);background:rgba(0,255,136,0.1);}
.kpi-trend.down{color:var(--accent-red);background:rgba(255,71,87,0.1);}

/* TABLES */
.data-table{width:100%;border-collapse:collapse;font-size:13px;}
.data-table th{padding:12px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border);background:rgba(0,212,255,0.03);}
.data-table td{padding:12px 16px;border-bottom:1px solid rgba(0,212,255,0.08);vertical-align:middle;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:rgba(0,212,255,0.04);}
.data-table-wrap{overflow-x:auto;}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.5px;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-pending{color:#ffd700;background:rgba(255,215,0,0.12);}
.badge-accepted{color:#00d4ff;background:rgba(0,212,255,0.12);}
.badge-inprogress{color:#1a6fff;background:rgba(26,111,255,0.15);}
.badge-paused{color:#ff6b35;background:rgba(255,107,53,0.12);}
.badge-anomaly{color:#ff4757;background:rgba(255,71,87,0.12);}
.badge-completed{color:#00ff88;background:rgba(0,255,136,0.12);}
.badge-approved{color:#00ff88;background:rgba(0,255,136,0.15);}
.badge-rejected{color:#ff4757;background:rgba(255,71,87,0.15);}
.badge-high{color:#ff4757;background:rgba(255,71,87,0.12);}
.badge-medium{color:#ffd700;background:rgba(255,215,0,0.12);}
.badge-low{color:#00ff88;background:rgba(0,255,136,0.12);}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;transition:var(--transition);border:none;letter-spacing:0.5px;}
.btn-primary{background:linear-gradient(135deg,var(--accent-blue),var(--accent-cyan));color:#fff;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--glow-cyan);}
.btn-secondary{background:rgba(0,212,255,0.1);color:var(--accent-cyan);border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--accent-cyan);background:rgba(0,212,255,0.15);}
.btn-success{background:rgba(0,255,136,0.15);color:var(--accent-green);border:1px solid rgba(0,255,136,0.3);}
.btn-success:hover{background:rgba(0,255,136,0.25);}
.btn-danger{background:rgba(255,71,87,0.15);color:var(--accent-red);border:1px solid rgba(255,71,87,0.3);}
.btn-danger:hover{background:rgba(255,71,87,0.25);}
.btn-warning{background:rgba(255,215,0,0.15);color:var(--accent-yellow);border:1px solid rgba(255,215,0,0.3);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-icon{padding:8px;border-radius:var(--radius);background:rgba(0,212,255,0.08);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;transition:var(--transition);}
.btn-icon:hover{border-color:var(--accent-cyan);color:var(--accent-cyan);}

/* GRID LAYOUTS */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;}
@media(max-width:992px){.grid-2,.grid-3{grid-template-columns:1fr;}}
@media(max-width:600px){.grid-auto{grid-template-columns:1fr;}}

/* FORMS */
.form-row{display:grid;gap:16px;margin-bottom:16px;}
.form-row.cols-2{grid-template-columns:1fr 1fr;}
.form-row.cols-3{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:768px){.form-row.cols-2,.form-row.cols-3{grid-template-columns:1fr;}}
.field-label{font-size:12px;color:var(--text-secondary);margin-bottom:6px;display:flex;align-items:center;gap:4px;}
.required{color:var(--accent-red);}
.field-input{width:100%;background:rgba(0,212,255,0.05);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;color:var(--text-primary);font-size:13px;outline:none;transition:var(--transition);}
.field-input:focus{border-color:var(--accent-cyan);box-shadow:0 0 0 3px rgba(0,212,255,0.08);}
.field-input option{background:var(--bg-secondary);}
textarea.field-input{min-height:100px;resize:vertical;}
.field-hint{font-size:11px;color:var(--text-muted);margin-top:4px;}

/* STEP WIZARD */
.wizard-steps{display:flex;align-items:center;gap:0;margin-bottom:28px;overflow-x:auto;padding-bottom:4px;}
.wizard-step{display:flex;align-items:center;gap:0;flex-shrink:0;}
.step-circle{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-muted);background:var(--bg-secondary);transition:var(--transition);flex-shrink:0;}
.step-label{font-size:11px;color:var(--text-muted);margin:0 8px;white-space:nowrap;}
.step-line{width:40px;height:1px;background:var(--border);}
.wizard-step.active .step-circle{border-color:var(--accent-cyan);color:var(--accent-cyan);box-shadow:var(--glow-cyan);}
.wizard-step.active .step-label{color:var(--accent-cyan);}
.wizard-step.done .step-circle{border-color:var(--accent-green);background:rgba(0,255,136,0.15);color:var(--accent-green);}
.wizard-step.done .step-line{background:var(--accent-green);}

/* KANBAN */
.kanban-board{display:flex;gap:16px;overflow-x:auto;padding-bottom:12px;}
.kanban-col{min-width:260px;flex-shrink:0;background:rgba(10,22,48,0.6);border:1px solid var(--border);border-radius:var(--radius);}
.kanban-col-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.kanban-col-title{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.kanban-count{background:rgba(0,212,255,0.15);color:var(--accent-cyan);padding:2px 8px;border-radius:10px;font-size:11px;}
.kanban-cards{padding:12px;display:flex;flex-direction:column;gap:10px;min-height:100px;}
.kanban-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:var(--transition);}
.kanban-card:hover{border-color:var(--border-bright);transform:translateY(-2px);box-shadow:var(--glow-cyan);}
.kanban-card-id{font-size:10px;color:var(--text-muted);margin-bottom:6px;font-family:monospace;}
.kanban-card-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:8px;line-height:1.4;}
.kanban-card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.kanban-card-assignee{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary);}
.avatar-sm{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent-blue),var(--accent-purple));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}

/* CHARTS */
.chart-container{position:relative;height:220px;width:100%;display:block;}
.chart-container canvas{display:block;width:100%!important;}

/* TIMELINE */
.timeline{position:relative;padding-left:24px;}
.timeline::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:1px;background:var(--border);}
.timeline-item{position:relative;margin-bottom:20px;}
.timeline-dot{position:absolute;left:-21px;top:4px;width:14px;height:14px;border-radius:50%;border:2px solid var(--accent-cyan);background:var(--bg-secondary);}
.timeline-dot.active{background:var(--accent-cyan);box-shadow:var(--glow-cyan);}
.timeline-dot.success{border-color:var(--accent-green);background:var(--accent-green);}
.timeline-dot.warning{border-color:var(--accent-yellow);background:var(--accent-yellow);}
.timeline-dot.danger{border-color:var(--accent-red);background:var(--accent-red);}
.timeline-time{font-size:10px;color:var(--text-muted);margin-bottom:4px;font-family:monospace;}
.timeline-text{font-size:13px;color:var(--text-secondary);}
.timeline-text strong{color:var(--text-primary);}

/* NOTIFICATION PANEL */
.notif-dropdown{position:absolute;top:calc(var(--header-h) + 4px);right:20px;width:340px;background:var(--bg-panel);border:1px solid var(--border-bright);border-radius:var(--radius);box-shadow:var(--glow-cyan),0 20px 40px rgba(0,0,0,0.5);z-index:200;display:none;}
.notif-dropdown.open{display:block;}
.notif-list{max-height:380px;overflow-y:auto;}
.notif-item{padding:14px 16px;border-bottom:1px solid rgba(0,212,255,0.08);cursor:pointer;transition:var(--transition);display:flex;gap:12px;}
.notif-item:hover{background:rgba(0,212,255,0.05);}
.notif-item.unread{border-left:3px solid var(--accent-cyan);}
.notif-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.notif-content{flex:1;min-width:0;}
.notif-title{font-size:12px;font-weight:600;color:var(--text-primary);margin-bottom:3px;}
.notif-msg{font-size:11px;color:var(--text-secondary);line-height:1.4;}
.notif-time{font-size:10px;color:var(--text-muted);margin-top:4px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg-panel);border:1px solid var(--border-bright);border-radius:16px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:var(--glow-cyan),0 20px 60px rgba(0,0,0,0.6);}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg-panel);z-index:1;}
.modal-title{font-size:16px;font-weight:700;color:var(--accent-cyan);}
.modal-close{background:transparent;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;padding:4px;}
.modal-close:hover{color:var(--text-primary);}
.modal-body{padding:24px;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

/* PROGRESS BAR */
.progress-bar{height:6px;background:rgba(0,212,255,0.1);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent-blue),var(--accent-cyan));transition:width 0.5s ease;}

/* FILTERS */
.filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.filter-input{background:rgba(0,212,255,0.05);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px;color:var(--text-primary);font-size:13px;outline:none;transition:var(--transition);}
.filter-input:focus{border-color:var(--accent-cyan);}
.filter-input option{background:var(--bg-secondary);}

/* STATUS ACTIONS (technician) */
.status-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
.status-action-btn{padding:16px;border-radius:var(--radius);border:1px solid;cursor:pointer;transition:var(--transition);text-align:center;background:transparent;}
.status-action-btn:hover{transform:translateY(-2px);}
.status-action-btn .sa-icon{font-size:24px;margin-bottom:8px;}
.status-action-btn .sa-label{font-size:13px;font-weight:600;}
.sab-start{border-color:rgba(0,255,136,0.4);color:var(--accent-green);}
.sab-start:hover{background:rgba(0,255,136,0.1);}
.sab-pause{border-color:rgba(255,107,53,0.4);color:var(--accent-orange);}
.sab-pause:hover{background:rgba(255,107,53,0.1);}
.sab-anomaly{border-color:rgba(255,71,87,0.4);color:var(--accent-red);}
.sab-anomaly:hover{background:rgba(255,71,87,0.1);}
.sab-complete{border-color:rgba(0,212,255,0.4);color:var(--accent-cyan);}
.sab-complete:hover{background:rgba(0,212,255,0.1);}

/* GLOW ACCENT LINE */
.section-title{font-size:16px;font-weight:700;letter-spacing:2px;color:var(--text-primary);margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}

/* MOBILE NAV */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg-panel);border-top:1px solid var(--border);z-index:200;padding:8px 0;}
.mobile-nav-items{display:flex;justify-content:space-around;}
.mobile-nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 12px;border-radius:var(--radius);cursor:pointer;color:var(--text-muted);font-size:10px;transition:var(--transition);}
.mobile-nav-item.active{color:var(--accent-cyan);}
.mobile-nav-item .mn-icon{font-size:20px;}
@media(max-width:768px){
  .sidebar{position:fixed;left:-var(--sidebar-w);z-index:300;transform:translateX(-100%);}
  .sidebar.mobile-open{transform:translateX(0);}
  .mobile-nav{display:block;}
  .content-area{padding:16px 12px 80px;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
}

/* TOOLTIP */
[data-tip]{position:relative;}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100%+6px);left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#fff;font-size:11px;padding:4px 8px;border-radius:4px;white-space:nowrap;pointer-events:none;z-index:100;}

/* CHIP */
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.2);color:var(--accent-cyan);}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:16px 0;}

/* EMPTY STATE */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);}
.empty-state .es-icon{font-size:48px;margin-bottom:12px;opacity:0.4;}
.empty-state p{font-size:14px;}

/* UPLOAD AREA */
.upload-area{border:2px dashed var(--border);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;transition:var(--transition);color:var(--text-muted);}
.upload-area:hover{border-color:var(--accent-cyan);color:var(--accent-cyan);background:rgba(0,212,255,0.04);}
.upload-area .ua-icon{font-size:32px;margin-bottom:8px;}
.upload-area p{font-size:12px;}

/* TABS */
.tab-bar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;}
.tab-item{padding:10px 16px;font-size:13px;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;transition:var(--transition);}
.tab-item.active{color:var(--accent-cyan);border-bottom-color:var(--accent-cyan);}
.tab-item:hover{color:var(--text-primary);}
.tab-content{display:none;}
.tab-content.active{display:block;}

/* ANALYTICS SPECIFIC */
.stat-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(0,212,255,0.06);}
.stat-row:last-child{border-bottom:none;}
.stat-row-label{font-size:12px;color:var(--text-secondary);flex:1;}
.stat-row-bar{flex:2;height:6px;background:rgba(0,212,255,0.1);border-radius:3px;overflow:hidden;}
.stat-row-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent-blue),var(--accent-cyan));}
.stat-row-val{font-size:12px;color:var(--text-primary);font-weight:600;width:40px;text-align:right;}

/* SCANNER/QR placeholder */
.qr-placeholder{background:rgba(0,212,255,0.05);border:2px dashed var(--border);border-radius:var(--radius);padding:40px;text-align:center;color:var(--text-muted);}

/* OVERLAY MOBILE BACKDROP */
.mobile-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:299;}
.mobile-backdrop.active{display:block;}

/* PULSE ANIMATION */
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
.pulse{animation:pulse 2s infinite;}
@keyframes blink{0%,100%{box-shadow:0 0 4px rgba(0,255,136,0.6);}50%{box-shadow:0 0 12px rgba(0,255,136,0.9);}}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent-green);animation:blink 1.5s infinite;}

/* MATERIAL ENTRY */
.material-list{display:flex;flex-direction:column;gap:8px;}
.material-item{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;background:rgba(0,212,255,0.04);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;}
.material-item input{background:transparent;border:none;color:var(--text-primary);font-size:13px;outline:none;width:100%;}

/* SLA indicator */
.sla-bar{display:flex;align-items:center;gap:8px;font-size:11px;}
.sla-track{flex:1;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;}
.sla-fill{height:100%;border-radius:2px;transition:width 0.5s;}
.sla-ok{background:var(--accent-green);}
.sla-warn{background:var(--accent-yellow);}
.sla-over{background:var(--accent-red);}

/* AUTH SYSTEM */
.auth-tabs{display:flex;margin-bottom:28px;gap:0;border-bottom:1px solid var(--border);}
.auth-tab{flex:1;padding:12px 8px;text-align:center;cursor:pointer;color:var(--text-secondary);font-size:13px;font-weight:600;letter-spacing:1px;transition:var(--transition);border:none;border-bottom:2px solid transparent;background:transparent;}
.auth-tab.active{color:var(--accent-cyan);border-bottom-color:var(--accent-cyan);}
.auth-panel{display:none;}
.auth-panel.active{display:block;}
.auth-status-msg{padding:14px 16px;border-radius:var(--radius);text-align:center;margin-bottom:16px;font-size:13px;line-height:1.5;}
.auth-msg-pending{background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.3);color:var(--accent-yellow);}
.auth-msg-error{background:rgba(255,71,87,0.08);border:1px solid rgba(255,71,87,0.3);color:var(--accent-red);}
.auth-msg-success{background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.3);color:var(--accent-green);}
.auth-msg-info{background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.2);color:var(--accent-cyan);}
.auth-link{color:var(--accent-cyan);cursor:pointer;text-decoration:underline;}
/* NOTIFICATION PAGE ITEMS */
.notif-page-card{transition:var(--transition);}
.notif-page-card:hover{border-color:var(--border-bright)!important;transform:translateY(-1px);}
.notif-unread-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-cyan);flex-shrink:0;box-shadow:0 0 6px var(--accent-cyan);}
/* ROLE VIEW SWITCHER (in-app header) */
.role-switcher{display:flex;gap:4px;align-items:center;}
.role-pill{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-muted);transition:var(--transition);white-space:nowrap;letter-spacing:0.5px;}
.role-pill:hover{background:rgba(0,212,255,0.08);border-color:rgba(0,212,255,0.4);color:var(--text-secondary);}
.role-pill.active{background:rgba(0,212,255,0.14);border-color:var(--accent-cyan);color:var(--accent-cyan);}
@media(max-width:768px){.role-switcher{display:none!important;}}

/* BROWSER MODE — read-only lockdown */
.browser-mode .status-actions,.browser-mode .status-action-btn{pointer-events:none!important;opacity:0.3!important;cursor:not-allowed!important;}
.browser-mode .btn-primary{pointer-events:none!important;opacity:0.35!important;cursor:not-allowed!important;}
.browser-mode .btn-danger,.browser-mode .btn-success,.browser-mode .btn-warning{pointer-events:none!important;opacity:0.35!important;cursor:not-allowed!important;}
.browser-mode .wizard-step-action .btn-primary,.browser-mode .form-group .btn-primary{pointer-events:none!important;opacity:0.35!important;}
.browser-banner{background:rgba(123,47,247,0.12);border:1px solid rgba(123,47,247,0.4);border-radius:var(--radius);padding:10px 18px;margin-bottom:16px;display:flex;align-items:center;gap:10px;color:#c4a8ff;font-size:12px;letter-spacing:1px;}

/* ACCOUNT MANAGEMENT */
.auth-role-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.5px;}
.auth-role-supervisor{background:rgba(255,215,0,0.15);color:#ffd700;border:1px solid rgba(255,215,0,0.3);}
.auth-role-manager{background:rgba(0,212,255,0.12);color:#00d4ff;border:1px solid rgba(0,212,255,0.25);}
.auth-role-browser{background:rgba(123,47,247,0.15);color:#c4a8ff;border:1px solid rgba(123,47,247,0.3);}
.acct-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px;}
.acct-row{display:grid;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(0,212,255,0.08);font-size:13px;}
.acct-row:last-child{border-bottom:none;}
.acct-row:hover{background:rgba(0,212,255,0.03);}
.acct-grid-head{grid-template-columns:2fr 1.5fr 1fr 1.2fr 1.5fr auto;font-size:11px;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;background:rgba(0,212,255,0.03);}
.acct-grid-row{grid-template-columns:2fr 1.5fr 1fr 1.2fr 1.5fr auto;}
.pend-grid-head{grid-template-columns:1.5fr 1.5fr 1fr 1fr 2fr auto;font-size:11px;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;background:rgba(0,212,255,0.03);}
.pend-grid-row{grid-template-columns:1.5fr 1.5fr 1fr 1fr 2fr auto;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="logo-icon">⚡</div>
      <h1>D M S</h1>
      <p>DISPATCH MANAGEMENT SYSTEM</p>
    </div>
    <!-- Role View Selector -->
    <div class="form-group" style="margin-bottom:20px">
      <label style="text-align:center;display:block;margin-bottom:10px;font-size:11px;letter-spacing:2px;color:var(--text-muted)">選擇登入視角 SELECT VIEW</label>
      <div class="role-cards">
        <div class="role-card active" id="rc-dispatcher" onclick="selectLoginRole('dispatcher',this)">
          <span class="role-icon">👔</span>
          <div class="role-name">派工管理員</div>
        </div>
        <div class="role-card" id="rc-technician" onclick="selectLoginRole('technician',this)">
          <span class="role-icon">🔧</span>
          <div class="role-name">執行人員</div>
        </div>
        <div class="role-card" id="rc-manager" onclick="selectLoginRole('manager',this)">
          <span class="role-icon">📊</span>
          <div class="role-name">查閱管理員</div>
        </div>
      </div>
    </div>
    <!-- Auth Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="showAuthTab('login',this)">🔐 登入系統</button>
      <button class="auth-tab" onclick="showAuthTab('register',this)">📝 申請帳號</button>
    </div>
    <!-- LOGIN PANEL -->
    <div class="auth-panel active" id="auth-panel-login">
      <div id="login-msg" class="auth-status-msg" style="display:none"></div>
      <div class="form-group">
        <label>電子郵件 EMAIL</label>
        <input class="form-input" id="login-email" type="email" placeholder="輸入電子郵件" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="form-group">
        <label>密碼 PASSWORD</label>
        <input class="form-input" type="password" id="login-pass" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn-login" onclick="doLogin()">🔐 登入系統</button>
      <div style="text-align:center;margin-top:16px;font-size:12px;color:var(--text-muted)">
        尚無帳號？<span class="auth-link" onclick="showAuthTabByName('register')">點此申請帳號</span>
      </div>
    </div>
    <!-- REGISTER PANEL -->
    <div class="auth-panel" id="auth-panel-register">
      <div id="register-msg" class="auth-status-msg" style="display:none"></div>
      <div class="form-group">
        <label>姓名 NAME</label>
        <input class="form-input" id="reg-name" placeholder="輸入真實姓名">
      </div>
      <div class="form-group">
        <label>電子郵件 EMAIL</label>
        <input class="form-input" id="reg-email" type="email" placeholder="輸入電子郵件">
      </div>
      <div class="form-group">
        <label>密碼 PASSWORD</label>
        <input class="form-input" type="password" id="reg-pass" placeholder="設定密碼（至少6位）">
      </div>
      <div class="form-group">
        <label>確認密碼 CONFIRM</label>
        <input class="form-input" type="password" id="reg-pass2" placeholder="再次輸入密碼">
      </div>
      <div class="form-group">
        <label>申請角色 ROLE</label>
        <select class="form-input" id="reg-role">
          <option value="dispatcher">派工管理員（Dispatcher）</option>
          <option value="technician">執行技術人員（Technician）</option>
          <option value="manager">查閱管理員（Manager）</option>
        </select>
      </div>
      <div class="form-group">
        <label>申請說明 NOTE（選填）</label>
        <input class="form-input" id="reg-note" placeholder="請說明申請用途">
      </div>
      <button class="btn-login" onclick="doRegister()">📨 送出申請</button>
      <div style="text-align:center;margin-top:16px;font-size:12px;color:var(--text-muted)">
        申請後需等 Supervisor 審核通過方可登入 ·
        <span class="auth-link" onclick="showAuthTabByName('login')">返回登入</span>
      </div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- MOBILE BACKDROP -->

function statusBadge(s){
  const map={pending:'待接受 badge-pending',accepted:'已接受 badge-accepted',inprogress:'執行中 badge-inprogress',paused:'暫停 badge-paused',anomaly:'異常 badge-anomaly',completed:'已完工 badge-completed',approved:'已核准 badge-approved',rejected:'已退回 badge-rejected'};
  const r=map[s]||'未知';const parts=r.split(' ');
  return `<span class="badge ${parts[1]}">${parts[0]}</span>`;
}
function priorityBadge(p){
  const map={high:'高優先 badge-high',medium:'中優先 badge-medium',low:'低優先 badge-low'};
  const r=map[p]||'未知';const parts=r.split(' ');
  return `<span class="badge ${parts[1]}">${parts[0]}</span>`;
}
function slaBar(task){
  const pct=Math.min(100,Math.round((task.elapsed/task.slaHours)*100));
  const cls=pct<70?'sla-ok':pct<90?'sla-warn':'sla-over';
  return `<div class="sla-bar"><span style="font-size:10px;color:var(--text-muted)">SLA</span><div class="sla-track"><div class="sla-fill ${cls}" style="width:${pct}%"></div></div><span style="font-size:10px;color:var(--text-muted)">${pct}%</span></div>`;
}
function fmtDate(d){return d||'—';}
function getStatusColor(s){const m={pending:'#ffd700',accepted:'#00d4ff',inprogress:'#1a6fff',paused:'#ff6b35',anomaly:'#ff4757',completed:'#00ff88',approved:'#00ff88',rejected:'#ff4757'};return m[s]||'#fff';}
function getTypeIcon(t){const m={create:'📋',system:'🤖',accept:'✅',start:'▶️',pause:'⏸️',anomaly:'⚠️',complete:'🏁',approve:'✅',reject:'❌'};return m[t]||'•';}

// Simple password obfuscation: btoa (base64 encode)
function simplePwHash(str){
  try{ return btoa(unescape(encodeURIComponent(str))); }
  catch(e){ return btoa(str); }
}

// Switch between login / register tabs on the login screen
function showAuthTab(name, el){
  document.querySelectorAll('.auth-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.auth-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('auth-panel-'+name).classList.add('active');
  // clear messages
  ['login-msg','register-msg'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none';});
}
function showAuthTabByName(name){
  const tabs=document.querySelectorAll('.auth-tab');
  const panels=['login','register'];
  const idx=panels.indexOf(name);
  if(idx<0)return;
  tabs.forEach((t,i)=>t.classList.toggle('active',i===idx));
  document.querySelectorAll('.auth-panel').forEach((p,i)=>p.classList.toggle('active',i===idx));
}
function authMsg(elId,type,html){
  const el=document.getElementById(elId);
  if(!el)return;
  el.style.display='';
  el.className='auth-status-msg auth-msg-'+type;
  el.innerHTML=html;
}

// ── LOGIN ────────────────────────────────────────────────────
function doLogin(){
  const email=(document.getElementById('login-email')?.value||'').trim().toLowerCase();
  const pass=document.getElementById('login-pass')?.value||'';
  if(!email||!pass){authMsg('login-msg','error','⚠️ 請輸入電子郵件與密碼');return;}
  const hashed=simplePwHash(pass);
  const user=DB.authUsers.find(u=>u.email.toLowerCase()===email&&u.password===hashed);
  if(!user){
    // Also check pending registrations so we can give a better message
    const pending=DB.pendingRegistrations.find(p=>p.email.toLowerCase()===email);
    if(pending&&pending.status==='pending'){authMsg('login-msg','pending','⏳ 您的帳號申請尚待 Supervisor 審核通過，請稍候通知');}
    else if(pending&&pending.status==='rejected'){authMsg('login-msg','error','🚫 帳號申請已被拒絕，請聯繫系統管理員');}
    else{authMsg('login-msg','error','❌ 電子郵件或密碼錯誤，請重新確認');}
    return;
  }
  if(user.status==='pending'){authMsg('login-msg','pending','⏳ 您的帳號申請尚待 Supervisor 審核通過');return;}
  if(user.status==='rejected'){authMsg('login-msg','error','🚫 帳號申請已被拒絕，請聯繫系統管理員');return;}
  if(user.status!=='active'){authMsg('login-msg','error','🚫 帳號狀態異常，請聯繫系統管理員');return;}
  // ── Login Success ──
  user.lastLogin=new Date().toLocaleString('zh-TW',{hour12:false}).replace(/\//g,'-');
  DB.currentAuth=user;
  // Use the role selected on the login screen (not the stored systemRole)
  // selectedSystemRole is set by the role cards; fallback to user's stored systemRole
  DB.currentRole=selectedSystemRole||user.systemRole||'dispatcher';
  DB.currentUser={name:user.name,avatar:user.avatar||user.name.charAt(0),email:user.email};
  // Apply browser-mode lockdown
  document.body.classList.toggle('browser-mode',user.authRole==='browser');
  // Show browser banner
  const bb=document.getElementById('browser-banner');
  if(bb)bb.style.display=user.authRole==='browser'?'flex':'none';
  // Show auth role chip in header
  const chip=document.getElementById('auth-role-chip');
  if(chip){
    const chipMap={supervisor:{label:'⭐ Supervisor',cls:'auth-role-supervisor'},manager:{label:'👤 Manager',cls:'auth-role-manager'},browser:{label:'👁️ Browser',cls:'auth-role-browser'}};
    const c=chipMap[user.authRole];
    if(c){chip.style.display='';chip.className='auth-role-badge '+c.cls;chip.textContent=c.label;}
  }
  document.getElementById('login-screen').style.display='none';
  const app=document.getElementById('app');
  app.classList.add('visible');
  buildNav();
  buildMobileNav();
  updateUserInfo();
  renderNotifList();
  // Show and sync role switcher in header
  const rs=document.getElementById('roleSwitcher');
  if(rs) rs.style.display='flex';
  syncRolePills(DB.currentRole);
  const cfg=ROLE_CONFIG[DB.currentRole];
  navigateTo(cfg.nav.find(n=>n.id)?.id||'dashboard');
}

// ── LOGOUT ───────────────────────────────────────────────────
function doLogout(){
  DB.currentAuth=null;
  document.body.classList.remove('browser-mode');
  const bb=document.getElementById('browser-banner');
  if(bb)bb.style.display='none';
  const chip=document.getElementById('auth-role-chip');

function doRegister(){

  const pass=document.getElementById('reg-pass')?.value||'';
  const pass2=document.getElementById('reg-pass2')?.value||'';
  const role=document.getElementById('reg-role')?.value||'dispatcher';
  const note=(document.getElementById('reg-note')?.value||'').trim();
  if(!name){authMsg('register-msg','error','⚠️ 請輸入姓名');return;}
  if(!email||!email.includes('@')){authMsg('register-msg','error','⚠️ 請輸入有效的電子郵件');return;}
  if(pass.length<6){authMsg('register-msg','error','⚠️ 密碼至少需要 6 個字元');return;}
  if(pass!==pass2){authMsg('register-msg','error','⚠️ 兩次輸入的密碼不一致，請重新確認');return;}
  if(DB.authUsers.find(u=>u.email.toLowerCase()===email)){authMsg('register-msg','error','⚠️ 此電子郵件已有使用中的帳號');return;}
  if(DB.pendingRegistrations.find(p=>p.email.toLowerCase()===email&&p.status==='pending')){authMsg('register-msg','pending','⏳ 此電子郵件已有一筆待審核的申請');return;}

    note,
    requestedAt:new Date().toLocaleString('zh-TW',{hour12:false}).replace(/\//g,'-'),
    status:'pending'
  };
  DB.pendingRegistrations.push(reg);
  // ── Email Notification to Supervisor ──
  const subj=encodeURIComponent('[DMS系統] 新帳號申請通知 — '+name);
  const body=encodeURIComponent(
    '您好，\n\n收到新的 DMS 系統帳號申請，請確認是否同意：\n\n'
    +'申請人姓名：'+name+'\n'
    +'電子郵件：'+email+'\n'
    +'申請角色：'+roleLabel+'\n'
    +'申請說明：'+(note||'（未填寫）')+'\n'
    +'申請時間：'+reg.requestedAt+'\n\n'
    +'請登入 DMS 系統 → 帳號管理 → 待審核申請 進行審核處理。\n\n'
    +'────────────────────\nDMS 派工管理系統 自動通知信'
  );
  window.open('mailto:soulzen127@gmail.com?subject='+subj+'&body='+body,'_blank');
  authMsg('register-msg','success',
    '✅ 帳號申請已成功送出！<br>已發送通知 Email 給系統管理員。<br>審核通過後即可使用帳號登入，請靜候通知。'
  );
  // Clear form
  ['reg-name','reg-email','reg-pass','reg-pass2','reg-note'].forEach(id=>{
    const e=document.getElementById(id);if(e)e.value='';
  });
}

function buildNav(){
  const cfg=ROLE_CONFIG[DB.currentRole];
  let html='';
  cfg.nav.forEach(n=>{
    if(n.section){html+=`<div class="nav-section"><div class="nav-section-label">${n.section}</div></div>`;return;}
    const badge=n.badge?`<span class="nav-badge">${n.badge}</span>`:'';
    html+=`<div class="nav-item" id="nav-${n.id}" onclick="navigateTo('${n.id}')"><span class="nav-icon">${n.icon}</span><span>${n.label}</span>${badge}</div>`;
  });
  // Supervisor-only: account management nav item
  if(DB.currentAuth?.authRole==='supervisor'){
    const pendingCnt=DB.pendingRegistrations.filter(r=>r.status==='pending').length;
    const pBadge=pendingCnt?`<span class="nav-badge">${pendingCnt}</span>`:'';
    html+=`<div class="nav-section"><div class="nav-section-label">帳號管理</div></div>`;
    html+=`<div class="nav-item" id="nav-account-mgmt" onclick="navigateTo('account-mgmt')"><span class="nav-icon">🔑</span><span>帳號管理</span>${pBadge}</div>`;
  }
  document.getElementById('sidebarNav').innerHTML=html;
}
function buildMobileNav(){
  const cfg=ROLE_CONFIG[DB.currentRole];
  const pages=cfg.mobileNav||[];
  const navItems=cfg.nav.filter(n=>n.id&&pages.includes(n.id));
  let html='<div class="mobile-nav-items">';
  navItems.forEach(n=>{
    html+=`<div class="mobile-nav-item" id="mnav-${n.id}" onclick="navigateTo('${n.id}')"><span class="mn-icon">${n.icon}</span>${n.label}</div>`;
  });
  html+='</div>';
  document.getElementById('mobileNav').innerHTML=html;
}

  document.getElementById('userAvatar').textContent=DB.currentUser.avatar;

// NOTIFICATIONS
// ============================================================
function toggleNotif(){
  document.getElementById('notifDropdown').classList.toggle('open');
}
function renderNotifList(){
  const unread=DB.notifications.filter(n=>!n.read).length;
  // Sync header bell badge
  const badge=document.getElementById('notifBadge');
  if(badge){badge.textContent=unread;badge.style.display=unread?'flex':'none';}
  // Sync sidebar nav badge for notifications dynamically
  const navNotif=document.getElementById('nav-notifications');
  if(navNotif){
    let nb=navNotif.querySelector('.nav-badge');
    if(unread>0){
      if(!nb){nb=document.createElement('span');nb.className='nav-badge';navNotif.appendChild(nb);}
      nb.textContent=unread;
    } else {
      if(nb)nb.remove();
    }
  }
  // Sync sidebar nav badge for approval queue dynamically
  const navApproval=document.getElementById('nav-approval');
  if(navApproval){
    const pendingApproval=DB.tasks.filter(t=>t.status==='completed').length;
    let ab=navApproval.querySelector('.nav-badge');
    if(pendingApproval>0){
      if(!ab){ab=document.createElement('span');ab.className='nav-badge';navApproval.appendChild(ab);}
      ab.textContent=pendingApproval;
    } else {
      if(ab)ab.remove();
    }
  }
  const iconMap={danger:'🔴',warning:'🟡',info:'🔵',success:'🟢'};
  const colorMap={danger:'rgba(255,71,87,0.2)',warning:'rgba(255,215,0,0.2)',info:'rgba(0,212,255,0.2)',success:'rgba(0,255,136,0.2)'};
  let html=DB.notifications.map(n=>`
    <div class="notif-item ${n.read?'':'unread'}" onclick="markOneRead('${n.id}');openTaskFromNotif('${n.taskId}')">
      <div class="notif-icon" style="background:${colorMap[n.type]}">${iconMap[n.type]}</div>
      <div class="notif-content">
        <div class="notif-title">${n.title}</div>
        <div class="notif-msg">${n.msg}</div>
        <div class="notif-time">${n.time}</div>
      </div>
      ${!n.read?`<div class="notif-unread-dot"></div>`:''}
    </div>`).join('');
  document.getElementById('notifList').innerHTML=html;
}
function markOneRead(notifId){
  const n=DB.notifications.find(x=>x.id===notifId);
  if(n&&!n.read){n.read=true;renderNotifList();}
}
function dismissNotif(notifId,event){
  if(event){event.stopPropagation();}
  const idx=DB.notifications.findIndex(x=>x.id===notifId);
  if(idx>-1){DB.notifications.splice(idx,1);renderNotifList();if(currentPage==='notifications')renderPage('notifications');}
}
function markAllRead(){
  DB.notifications.forEach(n=>n.read=true);
  renderNotifList(); // updates badge + dropdown
  if(currentPage==='notifications')renderNotifications(); // updates page list
}
function openTaskFromNotif(taskId){
  document.getElementById('notifDropdown').classList.remove('open');
  if(taskId)navigateTo('task-detail',{id:taskId});
}
document.addEventListener('click',function(e){
  const dd=document.getElementById('notifDropdown');

});
